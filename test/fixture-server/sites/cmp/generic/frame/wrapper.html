<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Rahmen</title></head>
<body style="margin:0">
<script>
  // The inner frame shows the bar named by ?bar=… (the settings bar by default); ?inner=tall makes it 400 px high, so in
  // a shorter outer frame its bar lies below what the outer frame shows.
  var params = new URLSearchParams(location.search);
  var bar = params.get('bar') || 'one-keyword-settings.html';
  var frame = document.createElement('iframe');
  frame.title = 'Hinweis';
  frame.src = '/' + (bar === 'one-keyword-accept.html' ? bar : 'one-keyword-settings.html');
  frame.style.cssText =
    params.get('inner') === 'tall'
      ? 'position:absolute;left:0;top:0;width:100%;height:400px;border:0'
      : 'position:fixed;left:0;top:0;width:100%;height:100%;border:0';
  document.body.appendChild(frame);
</script>
</body>
</html>
