<!doctype html>
<html lang="de">
<head>

<title>Unbekannter Banner (Hauptdokument)</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.cookie-note{position:fixed;left:0;right:0;bottom:0;background:#222;color:#fff;padding:16px;z-index:50}

</head>
<body>
<main><h1>Beispiel Bäckerei</h1><p>Frische Brötchen jeden Tag.</p></main>
<div class="cookie-note">

  <button type="button" onclick="this.parentNode.remove()">Akzeptieren</button>
  <button type="button">Einstellungen</button>
</div>
</body>
</html>
