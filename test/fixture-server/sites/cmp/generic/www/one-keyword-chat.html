<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Feste Chat-Box mit einem Stichwort</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.chat-box{position:fixed;right:16px;bottom:16px;width:360px;background:#fff;border:1px solid #ccc;padding:16px;z-index:50}
.chat-box button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Beispiel Versand</h1><p>Bestellen Sie bequem online.</p></main>
<div class="chat-box">
  <p>Fragen? Unser Team hilft gern. Mit dem Start des Chats gilt unsere Datenschutzerklärung.</p>
  <button type="button">Chat starten</button>
  <button type="button" aria-label="Schließen">×</button>
</div>
</body>
</html>
