<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Banner am Ende einer sehr langen Seite</title>
<style>body{font-family:sans-serif;margin:0} .item{height:2px}
.cookie-note{position:fixed;left:0;right:0;bottom:0;background:#222;color:#fff;padding:16px;z-index:50}
.cookie-note button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main id="catalog"><h1>Beispiel Katalog</h1></main>
<script>
  // More elements than the probe scans in document order, all before the banner.
  const catalog = document.getElementById('catalog');
  for (let i = 0; i < 7000; i++) {
    const item = document.createElement('div');
    item.className = 'item';
    catalog.appendChild(item);
  }
</script>
<div class="cookie-note">
  <p>Diese Website nutzt Cookies und Tracking von Drittanbietern.</p>
  <button type="button">Ablehnen</button>
  <button type="button">Akzeptieren</button>
</div>
</body>
</html>
