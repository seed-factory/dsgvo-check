<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cookie-Dialog mit einem Stichwort und nur einer Schließen-Schaltfläche</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.notice{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:16px;z-index:50}</style>
</head>
<body>
<main><h1>Beispiel Mode</h1><p>Neue Kollektion.</p></main>
<div class="notice" role="dialog" aria-label="Hinweis">
  <p>Diese Website verwendet Cookies.</p>
  <button type="button" aria-label="Schließen">×</button>
</div>
</body>
</html>
