<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cookie-Leiste mit langen aria-label der Schaltflächen</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:16px;z-index:50}
.bar button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Beispiel Shop</h1><p>Willkommen.</p></main>
<div class="bar">
  <p>Wir verwenden Cookies. Details in der Datenschutzerklärung.</p>
  <button type="button" aria-label="Alle Cookies akzeptieren und der Verarbeitung für Statistik und Marketing durch Drittanbieter zustimmen">Alle akzeptieren</button>
  <button type="button" aria-label="Alle Cookies ablehnen und nur die für den Betrieb der Website technisch notwendigen Cookies zulassen">Ablehnen</button>
</div>
</body>
</html>
