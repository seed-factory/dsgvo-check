<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Feste Chat-Box mit einem Stichwort und „Details“</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.chat-teaser{position:fixed;right:16px;bottom:16px;width:360px;background:#fff;border:1px solid #ccc;padding:16px;z-index:50}
.chat-teaser button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Beispiel Versicherung</h1><p>Beratung online.</p></main>
<div class="chat-teaser">
  <p>Mit dem Start akzeptieren Sie die Datenschutzhinweise.</p>
  <button type="button">Chat starten</button>
  <button type="button">Details</button>
</div>
</body>
</html>
