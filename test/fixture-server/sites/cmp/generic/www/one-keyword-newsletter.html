<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Feste Newsletter-Box mit einem Stichwort</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.signup{position:fixed;right:16px;bottom:16px;width:420px;background:#fff;border:1px solid #ccc;padding:16px;z-index:50}
.signup button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Beispiel Blog</h1><p>Neue Beiträge jede Woche.</p></main>
<div class="signup">
  <p>Neuigkeiten per E-Mail. Hinweise zur Verarbeitung stehen in der Datenschutzerklärung.</p>
  <label>E-Mail <input type="email" name="email"></label>
  <button type="button">Newsletter abonnieren</button>
  <button type="button">Abonnieren und akzeptieren</button>
  <button type="button" aria-label="Schließen">×</button>
</div>
</body>
</html>
