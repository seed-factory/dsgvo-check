<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Tuntematon banneri (suomi)</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.notice{position:fixed;left:0;right:0;bottom:0;background:#222;color:#fff;padding:16px;z-index:50}
.notice button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Esimerkki Leipomo</h1><p>Tuoreita sämpylöitä joka päivä.</p></main>
<div class="notice">
  <p>Tämä sivusto käyttää evästeitä. Hyväksymällä annat suostumuksesi evästeiden käyttöön. Lue lisää tietosuojaselosteesta.</p>
  <button type="button">Hylkää kaikki</button>
  <button type="button">Hyväksy kaikki</button>
  <button type="button">Asetukset</button>
</div>
</body>
</html>
