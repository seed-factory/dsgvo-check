<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fester Hinweis, dessen Beschreibung für Screenreader verborgen ist</title>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px}
.notice-root{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:12px 24px;z-index:50}
.notice-root button{padding:8px 14px;margin-right:8px}</style>
</head>
<body>
<main><h1>Beispiel Restaurant</h1><p>Tisch reservieren.</p></main>
<div class="notice-root" role="region" aria-label="Hinweis">
  <p><span aria-hidden="true">Wir verwenden Cookies und ähnliche Techniken. Hinweise stehen in der Datenschutzerklärung.</span></p>
  <button type="button">OK</button>
  <button type="button">Einstellungen</button>
</div>
</body>
</html>
