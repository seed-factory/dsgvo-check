<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cookiebot-Simulator: mit Schließen-Knopf</title>
<!-- The banner with Ablehnen and, as Cookiebot renders it, the close button with the vendor's own id: CamelCase words
     with a short suffix, which the vendor role `close` in adapters.yaml names. -->
<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="00000000-sim0-0000-0000-000000000000" data-blockingmode="auto" data-sim-variant="reject"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var dialog = document.getElementById('CybotCookiebotDialog');
    if (!dialog) return;
    var close = document.createElement('button');
    close.type = 'button';
    close.id = 'CybotCookiebotBannerCloseButtonE2E';
    close.className = 'CybotCookiebotBannerCloseButton';
    close.setAttribute('aria-label', 'Schließen');
    close.textContent = '×';
    close.style.cssText = 'position:absolute;top:8px;right:8px;padding:4px 10px';
    dialog.appendChild(close);
  });
</script>
<style>body{font-family:sans-serif;margin:0} main{min-height:2400px;padding:24px} footer{padding:24px}</style>
</head>
<body>
<main><h1>Beispiel GmbH</h1><p>Inhalt der Startseite.</p></main>
<footer><a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutzerklärung</a></footer>
</body>
</html>
