<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Kontakt</title>
</head>
<body>
  <h1>Kontakt</h1>
  <!-- The map sits below the first screen and beyond the distance at which Chromium loads a lazy frame early, also on
       a slow connection (up to 8000 px). -->
  <div style="height:9000px">Anfahrt weiter unten</div>
  <iframe title="Karte" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2427.0!2d13.4!3d52.5" width="600" height="300" loading="lazy"></iframe>
  <footer>
    <a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutzerklärung</a>
  </footer>
  <div id="stub-cmp" role="dialog" aria-label="Cookie-Einstellungen"
       style="position:fixed;left:0;right:0;bottom:0;height:150px;background:#fff;border-top:2px solid #333;padding:16px;z-index:1000">
    <p>Wir verwenden Cookies für Statistik. <a href="/datenschutz/">Datenschutzerklärung</a></p>
    <button id="stub-accept" type="button">Alle akzeptieren</button>
    <button id="stub-reject" type="button">Ablehnen</button>
  </div>
  <script src="/cmp.js"></script>
  <script>
    // Each listener leaves a cookie name behind: the page saw its viewport change, but never a scroll.
    window.addEventListener('scroll', function () { document.cookie = 'kontakt_scrolled=1; path=/'; }, { passive: true });
    window.addEventListener('resize', function () { document.cookie = 'kontakt_resized=1; path=/'; });
  </script>
</body>
</html>
