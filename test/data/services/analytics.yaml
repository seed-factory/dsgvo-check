        stage: loaded
      - id: ingest
        hosts: [sentry.io]
        path: "/api/[0-9]+/(envelope|store)/?$"
        kind: hit
        stage: event-sent
    aliasesDe: [Sentry]
    aliasesEn: [Sentry]
    companyAliases: [Functional Software]

