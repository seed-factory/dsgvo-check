# Analytics, session recording, tag managers, monitoring. Format: see _catalog.yaml.
services:
  - id: google-analytics
    name: Google Analytics
    category: analytics
    policyRelevance: required
    provider: { name: Google Ireland Limited, country: IE }
    parent: { name: Google LLC, country: US }
    dpfEntity: { name: Google LLC }
    consentStorage: analytics
    domains: [google-analytics.com, analytics.google.com, stats.g.doubleclick.net]
    signatures:
      - id: ga4-collect
        hosts: [google-analytics.com, analytics.google.com, stats.g.doubleclick.net]
        anyHost: true
        path: "/g/collect$"
        kind: hit
        stage: event-sent
        identifierParams: [cid, uid]
      - id: gtag-ga4
        hosts: [googletagmanager.com]
        anyHost: true
        path: "/gtag/js$"
        query: { id: "^G-" }
        kind: library
        stage: loaded
      - id: analytics-js
        hosts: [google-analytics.com]
        path: '^/(analytics|ga|urchin)\.js$'
        kind: library
        stage: loaded
      - id: ua-collect
        hosts: [google-analytics.com, stats.g.doubleclick.net]
        path: "^/(r/|j/)?collect$"
        kind: hit
        stage: event-sent
        identifierParams: [cid, uid]
      # Audience hit of the advertising features, sent to the country domain of Google search the visitor is served.
      - id: ga-audiences
        hostPatterns: ['^www\.google\.(com|[a-z]{2}|co\.[a-z]{2}|com\.[a-z]{2})$']
        path: "^/ads/ga-audiences$"
        kind: hit
        stage: event-sent
        identifierParams: [cid, uid]
    cookies: [_ga, _ga_*, _gid, _gac_*, __utma, __utmz]
    otherCookies: [_gat, _gat_*, __utmb, __utmc, __utmt]
    aliasesDe: [Google Analytics, Google Analytics 4, GA4, Universal Analytics]
    aliasesEn: [Google Analytics]
    companyAliases: [Google Ireland Ltd, Google Ireland Ltd.]

  - id: google-tag-manager
    name: Google Tag Manager
    category: tag-manager
    policyRelevance: required
    provider: { name: Google Ireland Limited, country: IE }
    parent: { name: Google LLC, country: US }
    dpfEntity: { name: Google LLC }
    domains: [googletagmanager.com]
    signatures:
      - id: gtm-js
        hosts: [googletagmanager.com]
        anyHost: true
        path: '/gtm\.js$'
        query: { id: "^GTM-" }
        kind: library
        stage: loaded
      - id: gtm-noscript
        hosts: [googletagmanager.com]
        path: '^/ns\.html$'
        kind: embed
        stage: loaded
      - id: gtag-google-tag
        hosts: [googletagmanager.com]
        anyHost: true
        path: "/gtag/js$"
        query: { id: "^GT-" }
        kind: library
        stage: loaded
    # "Tagmanager" written as one word is a common German spelling of the product name.
    aliasesDe: [Google Tag Manager, Google-Tag-Manager, Google Tagmanager, Google Tag]
    aliasesEn: [Google Tag Manager, Google Tag]
    companyAliases: [Google Ireland Ltd, Google Ireland Ltd.]

  - id: matomo
    name: Matomo
    category: analytics
    policyRelevance: required
    # Self-hosted or agency-hosted Matomo/Piwik is detected by path; the operator is not known from the catalog.
    selfHostable: true
    signatures:
      - id: tracker-js
        anyHost: true
        path: '/(matomo|piwik)\.js$'
        kind: library
        stage: loaded
      - id: tracker-hit
        anyHost: true
        path: '/(matomo|piwik)\.php$'
        kind: hit
        stage: event-sent
        identifierParams: [_id, uid, cid]
      - id: tag-manager-container
        anyHost: true
        path: '/js/container_[A-Za-z0-9]+\.js$'
        kind: library
        stage: loaded
    cookies: [_pk_id.*, _pk_ref.*, _pk_cvar.*, _pk_hsr.*]
    otherCookies: [_pk_ses.*, _pk_testcookie.*]
    aliasesDe: [Matomo, Piwik]
    aliasesEn: [Matomo, Piwik]

  - id: matomo-cloud
    name: Matomo Cloud
    category: analytics
    policyRelevance: required
    provider: { name: InnoCraft Ltd, country: NZ }
    domains: [matomo.cloud, innocraft.cloud]
    signatures:
      - id: tracker-js
        hosts: [matomo.cloud, innocraft.cloud]
        path: '\.js$'
        kind: library
        stage: loaded
      - id: tracker-hit
        hosts: [matomo.cloud, innocraft.cloud]
        path: '/(matomo|piwik)\.php$'
        kind: hit
        stage: event-sent
        identifierParams: [_id, uid, cid]
    aliasesDe: [Matomo Cloud, Matomo]
    aliasesEn: [Matomo Cloud, Matomo]
    companyAliases: [InnoCraft]

  - id: etracker
    name: etracker Analytics
    category: analytics
    policyRelevance: required
    provider: { name: etracker GmbH, country: DE }
    domains: [etracker.com, etracker.de, etracker.net]
    signatures:
      - id: loader
        hosts: [code.etracker.com]
        path: "^/"
        kind: library
        stage: loaded
    aliasesDe: [etracker]
    aliasesEn: [etracker]

  - id: adobe-analytics
    name: Adobe Analytics
    category: analytics
    policyRelevance: required
    provider: { name: Adobe Systems Software Ireland Limited, country: IE }
    parent: { name: Adobe Inc., country: US }
    dpfEntity: { name: Adobe Inc. }
    domains: [omtrdc.net, 2o7.net, demdex.net]
    signatures:
      - id: beacon
        hosts: [omtrdc.net, 2o7.net]
        path: "^/b/ss/"
        kind: hit
        stage: event-sent
      # Audience Manager id sync: the visitor id sits in the path (`/ibs:dpid=…&dpuuid=…`), read before redaction.
      - id: ibs-sync
        hosts: [demdex.net]
        path: "^/ibs:"
        kind: hit
        stage: loaded
        identifierParams: [dpuuid]
      # Experience Edge consent call: a service request, not an analytics hit.
      - id: edge-privacy
        hosts: [demdex.net]
        path: "^/ee/v1/privacy/"
        kind: resource
        stage: loaded
    cookies: [s_vi, s_ecid, AMCV_*, s_fid, demdex@demdex.net]
    otherCookies: [s_cc, s_sq, AMCVS_*]
    aliasesDe: [Adobe Analytics, Adobe Experience Cloud, Adobe Audience Manager]
    aliasesEn: [Adobe Analytics, Adobe Experience Cloud]

  - id: adobe-experience-platform-tags
    name: Adobe Experience Platform Tags
    category: tag-manager
