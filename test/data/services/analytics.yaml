    category: analytics
    policyRelevance: required
    domains: [mc.yandex.ru, mc.yandex.com, mc.webvisor.org]
    cookies: [_ym_uid, _ym_d]
    otherCookies: [_ym_isad, _ym_visorc]
    aliasesDe: [Yandex Metrica, Yandex.Metrica, Yandex Metrika]
    aliasesEn: [Yandex Metrica, Yandex.Metrica]

  - id: hubspot
    name: HubSpot
    category: analytics
    policyRelevance: required
    parent: { name: "HubSpot, Inc.", country: US }
    dpfEntity: { name: "HubSpot, Inc." }
    domains:
      - hs-scripts.com
      - hs-analytics.net
      - hscollectedforms.net
      - hs-banner.com
      - hubspot.com
      - hsforms.com
      - hsforms.net
      - hubapi.com
      - usemessages.com
    signatures:
      - id: tracking-pixel
        hosts: [hubspot.com, hs-analytics.net]
        path: '^/__ptq\.gif$'
