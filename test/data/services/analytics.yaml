        kind: hit
        stage: event-sent
    cookies: [_hjSessionUser_*, _hjSession_*, _hjid]
    otherCookies:
      [
        _hjFirstSeen,
        _hjIncludedInSessionSample*,
        _hjAbsoluteSessionInProgress,
        _hjTLDTest,
        _hjLocalStorageTest,
        _hjSessionStorageTest,
