    provider: { name: Adobe Systems Software Ireland Limited, country: IE }
    parent: { name: Adobe Inc., country: US }
    dpfEntity: { name: Adobe Inc. }
    domains: [adobedtm.com]
    aliasesDe: [Adobe Experience Platform Tags, Adobe Launch, Adobe Dynamic Tag Management]
    aliasesEn: [Adobe Experience Platform Tags, Adobe Launch]

  - id: plausible
