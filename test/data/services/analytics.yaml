        stage: event-sent
    cookies: [_clck, _clsk, CLID@clarity.ms]
    aliasesDe: [Microsoft Clarity, Clarity]
    aliasesEn: [Microsoft Clarity]

  # Sentry is a trade name of Functional Software, Inc., which operates the service itself (no group parent).
  - id: sentry
    name: Sentry
    category: monitoring
    policyRelevance: required
    provider: { name: "Functional Software, Inc.", country: US }
    dpfEntity: { name: "Functional Software, Inc." }
