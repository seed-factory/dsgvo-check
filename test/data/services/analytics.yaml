  # measurement and tag management
  # Same rules as ads.yaml: observed endpoints, no provider claim without vendor documentation.
  - id: scorecardresearch
    name: ScorecardResearch (comScore)
    category: analytics
    policyRelevance: required
    domains: [scorecardresearch.com]
    signatures:
      - id: beacon-js
        hosts: [scorecardresearch.com]
        path: '/beacon\.js$'
        kind: library
        stage: loaded
      - id: beacon
        hosts: [scorecardresearch.com]
        path: "^/b$"
        kind: hit
        stage: event-sent
    aliasesDe: [ScorecardResearch, comScore]
    aliasesEn: [ScorecardResearch, comScore]

  # The domains also cover identity, experience, checkout and REST hosts of the vendor. A domain-only match
  # classifies the request, but an xhr/fetch/image/ping without a signature becomes a `hit` in derive.
  # CONSENT-01 reads that as `cookieless-ping` and TRACK-01 as "event sent". Therefore every service
  # endpoint of the vendor (Piano ID, experience, checkout, REST) is a `resource` signature, EU and non-EU host alike;
  # the domains stay broad so that PRIV-01 still names the service.
  - id: piano
    name: Piano (Cxense)
    category: analytics
    policyRelevance: required
    domains: [piano.io, cxense.com]
    signatures:
      - id: sdk
        hosts: [cdn.piano.io, cdn-eu.piano.io]
        path: '^/api/tinypass\.min\.js$'
        kind: library
        stage: loaded
      - id: cxense-script
        hosts: [cdn.cxense.com]
        path: '^/cx\.js$'
        kind: library
        stage: loaded
      - id: engagement
        hosts: [c2.piano.io, c2-eu.piano.io]
        path: "^/page/track/engagement$"
        kind: hit
        stage: event-sent
      - id: experience-and-checkout
        hosts:
          - c2.piano.io
          - c2-eu.piano.io
          - experience.piano.io
          - experience-eu.piano.io
          - buy.piano.io
          - buy-eu.piano.io
        path: "^/(xbuilder/experience/|checkout/|showtemplate/|api/v3/anon/template/)"
        kind: resource
      - id: identity
        hosts: [id.piano.io, id-eu.piano.io, id-au.piano.io, id-ap.piano.io]
        path: "^/(id/)?api/v1/"
        kind: resource
      - id: rest-api
        hosts: [api.piano.io, api-eu.piano.io, api-au.piano.io, api-ap.piano.io]
        path: "^/api/v3/"
        kind: resource
    aliasesDe: [Piano, Cxense]
    aliasesEn: [Piano, Cxense]

  - id: tealium
    name: Tealium
    category: tag-manager
    policyRelevance: required
    domains: [tiqcdn.com, tealiumiq.com]
    cookies: [utag_main]
    signatures:
      - id: utag
        hosts: [tags.tiqcdn.com, tags-eu.tiqcdn.com]
        path: '^/utag/[^/]+/[^/]+/[^/]+/utag[^/]*\.js$'
        kind: library
        stage: loaded
      - id: collect
        hosts: [collect.tealiumiq.com]
        path: "^/event$"
        kind: hit
        stage: event-sent
    aliasesDe: [Tealium]
    aliasesEn: [Tealium]

