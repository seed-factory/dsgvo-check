  # programmatic ad tech
  # Hosts and paths come from observed traffic, generalised to each vendor's endpoints. Cookie-sync pixels are
  # `hit` with stage `loaded` (a sync, not an event). No provider or DPF claim without vendor documentation.
  # `identifierParams` only where the identifier parameter was seen in the traffic.
  - id: the-trade-desk
    name: The Trade Desk
    category: ads
    policyRelevance: required
    domains: [adsrvr.org]
    signatures:
      - id: universal-pixel
        hosts: [js.adsrvr.org]
        path: '^/universal_pixel\.js$'
        kind: library
        stage: loaded
      - id: conversion
        hosts: [insight.adsrvr.org, match.adsrvr.org]
        path: "^/track/(cei|realtimeconversion)$"
        kind: hit
        stage: event-sent
      - id: cookie-match
        hosts: [match.adsrvr.org]
        path: "^/track/(rid|usersync|cmf/generic)$"
        kind: hit
        stage: loaded
    aliasesDe: [The Trade Desk, Trade Desk]
    aliasesEn: [The Trade Desk, Trade Desk]

