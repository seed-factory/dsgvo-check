# Advertising, conversion tracking and remarketing. Format: see _catalog.yaml.
services:
  - id: google-ads
    name: Google Ads
    category: ads
    policyRelevance: required
    provider: { name: Google Ireland Limited, country: IE }
    parent: { name: Google LLC, country: US }
    dpfEntity: { name: Google LLC }
    consentStorage: ad
    domains: [googleadservices.com, googleads.g.doubleclick.net]
    # `auid` carries the value of the first-party `_gcl_au` cookie (conversion linker), so it is persistent.
    signatures:
      - id: gtag-aw
        hosts: [googletagmanager.com]
        anyHost: true
        path: "/gtag/js$"
        query: { id: "^AW-" }
        kind: library
        stage: loaded
      - id: conversion-js
        hosts: [googleadservices.com]
        path: '^/pagead/conversion(_async)?\.js$'
        kind: library
        stage: loaded
      - id: conversion
        hosts: [googleadservices.com, googleads.g.doubleclick.net]
        path: "^/(pagead|ccm)/"
        kind: hit
        stage: event-sent
        identifierParams: [auid]
      # Google tag hits on the country domains of Google search (`www.google.de`, `www.google.co.uk`, …): which one is
      # used depends on the visitor's location, so the host is a pattern.
      - id: google-domain-hit
        hostPatterns: ['^www\.google\.(com|[a-z]{2}|co\.[a-z]{2}|com\.[a-z]{2})$']
        path: "^/(pagead|ccm|rmkt)/"
        kind: hit
        stage: event-sent
        identifierParams: [auid]
      # Google Ads hits on AdSense and DoubleClick hosts: the Google tag sends conversion and page-view events of an
      # `AW-` account there too; other paths of these hosts stay with AdSense and the Marketing Platform.
      - id: syndication-ccm
        hosts: [pagead2.googlesyndication.com]
        path: "^/ccm/collect$"
        query: { tid: "^AW-" }
        kind: hit
        stage: event-sent
        identifierParams: [auid]
      - id: syndication-conversion
        hosts: [pagead2.googlesyndication.com]
        path: "^/pagead/(conversion|viewthroughconversion|1p-conversion|1p-user-list)/"
        kind: hit
        stage: event-sent
        identifierParams: [auid]
      - id: doubleclick-ccm
        hosts: [ad.doubleclick.net]
        path: "^/ccm/"
        kind: hit
        stage: event-sent
        identifierParams: [auid]
    cookies: [_gcl_au, _gcl_aw, _gcl_dc, _gcl_gb, _gcl_gs, _gcl_ag]
    storageKeys: [_gcl_ls]
    aliasesDe: [Google Ads, Google AdWords, AdWords, Google Ads Conversion Tracking, Google Remarketing]
    aliasesEn: [Google Ads, Google AdWords, Google Ads Conversion Tracking]
    companyAliases: [Google Ireland Ltd, Google Ireland Ltd.]

  - id: google-marketing-platform
    name: Google Marketing Platform (DoubleClick)
    category: ads
    policyRelevance: required
    provider: { name: Google Ireland Limited, country: IE }
    parent: { name: Google LLC, country: US }
    dpfEntity: { name: Google LLC }
    consentStorage: ad
    domains: [doubleclick.net]
    signatures:
      - id: gtag-floodlight
        hosts: [googletagmanager.com]
        anyHost: true
        path: "/gtag/js$"
        query: { id: "^DC-" }
        kind: library
        stage: loaded
      # The ids of the sinks below sit in matrix parameters of the path (`;dc_pre=…`); the collector reads them before
      # the path is redacted, the names here make them persistent identifiers.
      - id: floodlight
        hosts: [ad.doubleclick.net, fls.doubleclick.net]
        path: "^/(activityi?|ddm/(activity|fls))([;/]|$)"
        kind: hit
        stage: event-sent
        identifierParams: [dc_pre, _dc_unique_id, dc_dbm_token, dc_ext_key, gdid]
      - id: ddm-activity
        hosts: [ade.googlesyndication.com]
        path: "^/ddm/activity/"
        kind: hit
        stage: event-sent
        identifierParams: [dc_pre, _dc_unique_id, dc_dbm_token, dc_ext_key, gdid]
      - id: gmp-conversion
        hostPatterns: ['^www\.google\.(com|[a-z]{2}|co\.[a-z]{2}|com\.[a-z]{2})$']
        path: "^/gmp/conversion/"
        kind: hit
        stage: event-sent
        identifierParams: [dc_pre, _dc_unique_id, dc_dbm_token, dc_ext_key, gdid]
    cookies: [IDE@doubleclick.net, DSID@doubleclick.net, id@doubleclick.net]
    otherCookies: [test_cookie@doubleclick.net]
    aliasesDe: [DoubleClick, Google Marketing Platform, Campaign Manager 360, Display & Video 360, Floodlight]
    aliasesEn: [DoubleClick, Google Marketing Platform, Campaign Manager 360, Floodlight]
    companyAliases: [Google Ireland Ltd, Google Ireland Ltd.]

