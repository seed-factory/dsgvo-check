# CONSENT-02 allowlist: entries are "nicht bewertet (Allowlist v<version>)" – this is NOT a statement that
# they are necessary. Name globs, case-insensitive. `security` (bot protection) is also included
# classes consent/session/load-balancer/csrf/language and needs customer approval.
allowlist:
  version: "2"
  cookies:
    consent:
      - CookieConsent
      - CookieConsentBulkSetting-*
      - CookieConsentBulkTicket
      - borlabs-cookie
      - borlabs-cookie-*
      - cmplz_*
      - complianz_*
      - real_cookie_banner*
      - rcb-*
      - ccm_consent
      - ccm_consent_*
      - cookiehub
      - OptanonConsent
      - OptanonAlertBoxClosed
      - uc_*
      - euconsent-v2
      - euconsent
      - __cmpcc*
      - __cmpconsent*
      - didomi_token
      - cookieyes-consent
      - CookieLawInfoConsent
      - cookielawinfo-checkbox-*
      - viewed_cookie_policy
      - moove_gdpr_popup
      - cookie_notice_accepted
      - cookie-agreed
      - cookie-agreed-*
      - cookieconsent_status
      - cc_cookie
      - klaro
      - mtm_consent
      - mtm_consent_removed
      - mtm_cookie_consent
      - __hs_opt_out
      - __hs_do_not_track
      - __hs_cookie_cat_pref
      - _iub_cs-*
      - usprivacy
      - SOCS
      # Consent state of consentmanager, Sourcepoint and Google Funding Choices. `*` also covers the
      # `_expire` companions. __cmpiuid and consentUUID are visitor identifiers and stay out (cmp-cookie-with-uid).
      # Sourcepoint is listed by the observed names: `_sp_v1_*` would also cover `_sp_v1_uid`, presumed to be an
      # identifier (not yet checked against vendor documentation, required for each pattern).
      - __cmpcpc*
      - __cmpcvc*
      - __cmpiab*
      - __cmpcccx*
      - __cmpfcc*
      - _sp_su
      - _sp_v1_ss
      - _sp_v1_p
      - _sp_v1_data
      - FCCDCF
      - FCNEC
    session:
      - PHPSESSID
      - PHPSESSID_*
      - JSESSIONID
      - ASP.NET_SessionId
      - ASPSESSIONID*
      - CFID
      - CFTOKEN
      - laravel_session
      - ci_session
      - connect.sid
      - session
      - sessionid
      - session-*
      - _session_id
      - SESS*
      - SSESS*
      - wordpress_test_cookie
      - fe_typo_user
      - be_typo_user
      - PrestaShop-*
      - frontend
      - frontend_cid
      - OCSESSID
      - JTLSHOP
      - sw-states
      - sid
    load-balancer:
      - AWSALB
      - AWSALBCORS
      - AWSALBTG
      - AWSALBTGCORS
      - AWSELB
      - AWSELBCORS
      - BIGipServer*
      - SERVERID
      - ROUTEID
      - ARRAffinity
      - ARRAffinitySameSite
      - TiPMix
      - x-ms-routing-name
      - lidc
    csrf:
      - XSRF-TOKEN
      - CSRF-TOKEN
      - csrftoken
      - csrf_token
      - csrf
      - _csrf
      - __RequestVerificationToken
      - __Host-csrf*
    language:
      - lang
      - language
      - locale
      - pll_language
      - wp-wpml_current_language
      - _icl_current_language
      - i18n_redirected
      - NEXT_LOCALE
      - qtrans_front_language
    security:
      - __cf_bm
      - cf_clearance
      - _cfuvid
      - __cfruid
      - __cflb
      - cf_chl_*
      - incap_ses_*
      - visid_incap_*
      - nlbi_*
      - ak_bmsc
      - bm_sv
      - bm_sz
      - bm_mi
      - _abck
      - TS01*
  storage:
    consent:
      - uc_settings
      - uc_ui_version
      - uc_user_interaction
      - ucData
      - borlabs-cookie*
      - BorlabsCookie*
      - cmplz_*
      - CookieConsent
      - real_cookie_banner*
      - rcb-*
      - ccm_consent*
      - cookiehub
      - didomi_token
      - euconsent-v2
      - OptanonConsent
      - _iub_cs-*
      - klaro
      - cookieyes-consent
      - __cmpconsent*
      # Consentmanager state (same names as the cookies above), Usercentrics v3 (`ucData_<settingsId>`)
      # and Sourcepoint local state. `__cmpiuid` stays out (identifier).
      - __cmpcpc*
      - __cmpcvc*
      - __cmpiab*
      - __cmpcccx*
      - __cmpfcc*
      - ucData_*
      - _sp_local_state
      - _sp_non_keyed_local_state
