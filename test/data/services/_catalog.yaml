# dsgvo-check service catalog. Own data, Apache-2.0, compiled from vendor documentation and well-known
# public hostnames. No content from EasyList/EasyPrivacy, NC- or GPL-licensed lists.
# Services live in the other files of this directory (`services:` arrays are concatenated by the loader).
#
# Entry fields (src/derive/catalog.ts validates them strictly):
# id, name, category, policyRelevance (required|optional|none)
# provider {name, country} – contracting party for EEA customers according to the catalog; omitted when not
# verified from vendor documentation ("laut Dienstekatalog", never a finding)
# parent {name, country} – group parent
# dpfEntity {name} – organisation to look up in the DPF list; listed/checkedAt stay null until checked
# domains – hosts or domain suffixes (longest suffix wins)
# signatures – {id, hosts?, anyHost?, path (regex), query? {param: regex}, kind, stage?,
# integration?, identifierParams?}; vendor-host signature > any-host signature > domain
# cookies / storageKeys – tracking identifiers (`name`, glob `name_*`, optional `@cookie-domain`)
# otherCookies – known cookies of the service that are not identifiers
# aliasesDe / aliasesEn / companyAliases – PRIV-01 matching levels named > company > domain; the category level
# uses `categories` below
#
# Draft: providers, aliases and the allowlist need review by the customer.
catalog:
  name: dsgvo-check-services
  version: "0.2.0"
  date: "2026-10-30"
  license: Apache-2.0
  attribution: "dsgvo-check service catalog, © dsgvo-check contributors, Apache-2.0"

