# Ruleset de-2026, module dns. Per (checkId, variant): default severity and CRM catalog code (or explicit null,
# JSON report only). T3 codes stay at warning or below (test). MAIL-02 follows the DMARC matrix of BSI TR-03182.
# Variants that describe missing or weak spoofing protection map to the catalog code; hygiene hints (deprecated
# ptr, softfail accepted by BSI TR-03182 under DMARC enforcement) do not. info mappings: Q2.
# The variant table in docs/03-checks.md §2.1 is generated from these files (`corepack pnpm registry`).
checks:
  MAIL-01:
    gating: true
    variants:
      record-not-found: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      policy-none: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      record-invalid: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      weak-option: { severity: info, crm: T3_MAIL_UNPROTECTED }
      legacy-pct: { severity: info, crm: T3_MAIL_UNPROTECTED }
  MAIL-02:
    gating: true
    variants:
      record-not-found: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      permissive-qualifier: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      record-invalid: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      softfail-without-enforcement: { severity: warning, crm: T3_MAIL_UNPROTECTED }
      softfail-with-enforcement: { severity: info, crm: null }
      ptr-mechanism: { severity: info, crm: null }
