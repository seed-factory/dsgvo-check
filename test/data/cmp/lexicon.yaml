# First-layer button lexicon for classifyFirstLayer.
# Matching (src/cmp/lexicon.ts): labels are normalized (NFKC, lower case, close glyphs → "×") and tokenized on
# letters/digits; punctuation between words (, ; : . ! ? brackets & / dashes) ends a clause, but a bracketed insertion
# does not end the negation of a consent it interrupts or opens ("Nicht (alle Cookies) akzeptieren", "Do not (accept
# all)", "Ich akzeptiere (die Cookies) nicht" and "Ich akzeptiere nicht (alle Cookies)" are no accept, "Ich akzeptiere
# (nicht empfohlen)" stays one), nor that of a reject phrase right after it by a negation right before it ("Nicht (alle
# Cookies) ablehnen" is no reject, "No (reject all)" and "Kein Tracking (empfohlen) alle ablehnen" stay one). A label
# equal to a phrase → confidence high; a phrase inside a longer label, within one clause → medium; the longest phrase
# wins, a tie between two kinds → unclassified, except one decision (reject/accept) tied only with close/hide/later
# ("Ablehnen und schließen" → reject) or with decision phrases the label qualifies ("Ich akzeptiere nur notwendige" →
# reject: "ich akzeptiere" is restricted). close/hide/later never outscore a decision ("Ablehnen und Fenster
# schließen" → reject), alone they are never a reject. "*suffix" matches any token ending with the suffix (German
# compounds such as "Datenschutzeinstellungen").
# After the German and English phrases of each class follow fr, es, it, pt, nl, da, no, sv, fi, is and pl phrases:
# they classify the buttons of unknown banners (generic heuristic, info only). A phrase may stand in one class only.
# negations, restrictions and paid qualify a reject or accept phrase, matched like the phrases: a reject or accept
# with a negation before its phrase in its clause ("No, reject all" is a reject), a reject phrase with a negation and a
# word of allWords after it ("Ich akzeptiere nicht alle Cookies", read as "Nicht alle akzeptieren"), an accept with a
# restriction outside its phrase, and any label with payment wording are no decision (kind other), and the CMP's own
# markup cannot make them one. A negation directly followed by a necessity word negates a cookie category, not the
# decision ("Nicht notwendige Cookies ablehnen"). A negation after a reject phrase never negates it ("Reject
# non-essential cookies", "Ablehnen (keine Statistik)"); after an accept phrase it does when it follows the phrase
# directly or ends its clause ("Ich akzeptiere keine Cookies", "Ich akzeptiere die Cookies nicht"), not in a clause of
# its own ("Akzeptieren und nicht mehr anzeigen", "Akzeptieren, nicht mehr anzeigen").
# Such a negated category ("nicht notwendige", "non-essential") is read as a whole: a phrase that ends on its negation
# or starts on its necessity word does not match ("Ich akzeptiere nicht notwendige Cookies" is no "ich akzeptiere
# nicht", "Nicht notwendige Cookies akzeptieren" no "notwendige cookies akzeptieren"). An accept with a necessity word
# outside its phrase that no negation precedes names the necessary cookies only and is no accept either ("Accept
# strictly necessary cookies"), unless a word of allWords that quantifies no necessity word makes it all cookies
# ("Alle Cookies akzeptieren, auch technisch notwendige"; "Alle notwendigen Cookies akzeptieren" stays no accept).
# A reject phrase that refuses only by naming the necessary cookies, without a negation or restriction ("accept
# necessary", "notwendige cookies akzeptieren"), counts only beside cookie, necessity, restriction and neutral words
# (the cookieKeywords sources match cookie words; "Mit notwendigen Cookies fortfahren (empfohlen)" is a reject): "Accept
# necessary and analytics cookies" consents to more, and "Accept necessary cookies and continue" is not read; both are
# no decision, and the CMP's markup can make them a reject only.
