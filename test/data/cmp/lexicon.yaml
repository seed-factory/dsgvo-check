# First-layer button lexicon for classifyFirstLayer.
# Matching (src/cmp/lexicon.ts): labels are normalized (NFKC, lower case, close glyphs → "×") and tokenized on
# letters/digits. A label equal to a phrase → confidence high; a phrase inside a longer label → medium; the longest
# phrase wins, a tie between two kinds → unclassified, except one decision (reject/accept) tied only with
# close/hide/later ("Ablehnen und schließen" → reject). "*suffix" matches any token ending with the suffix
# (German compounds such as "Datenschutzeinstellungen"). close/hide/later alone are never a reject.
# After the German and English phrases of each class follow fr, es, it, pt, nl, da, no, sv, fi, is and pl phrases:
# they classify the buttons of unknown banners (generic heuristic, info only). A phrase may stand in one class only.
