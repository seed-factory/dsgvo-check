# Mail domains the DNS stage after the browser does not query for an address seen in the Impressum. A free-mail
# provider's DMARC and SPF are not the site's own settings. Exact, lower-case domains: `gmx.de` excludes `gmx.de`
# only, not `gmx.de.example.test` or `mail.gmx.de`.
