  # Counts of the findings in "What to do"; `items`: its points when similar findings share one, else 0.
  report.overview.findings: "{critical, plural, =0 {No critical findings were observed.} one {One critical finding was observed.} other {# critical findings were observed.}}{warning, plural, =0 {} one { One finding should be checked.} other { # findings should be checked.}}{info, plural, =0 {} one { There is also one note for information.} other { There are also # notes for information.}}{items, plural, =0 {} one { Similar findings are combined into one point below.} other { Similar findings are combined into # points below.}}"
  # The rows of the table of observed services, which are findings too; `table` is the heading of the table.
  report.overview.services: '{count, plural, one {One observed service is} other {# observed services are}} listed in the table "{table}".'
  report.overview.failed: The scan was not performed, so there are no observations.
  # `gaps`: the scan ran to its end, but some checks gave no conclusive result (the next sentences say which).
  # `ran`: every check has a result, some only for a part (the next sentence says which and why).
  report.overview.scan: "{state, select, complete {The scan was completed.} gaps {The scan ran to the end, but not every check has a conclusive result.} ran {The scan ran to the end.} other {The scan was only partly performed; not all pages or checks could be evaluated.}}"
  # Checks without a conclusive result, grouped by `cause`; `checks` lists their ids.
  report.overview.open: >-
    {count, plural, one {One check} other {# checks}} ({checks}) {cause, select, tls-blocked {{count, plural, one
    {was} other {were}} not run: the certificate of the website was not accepted as valid, so the browser did not
    visit the website.} tls-fallback-failed {{count, plural, one {was} other {were}} not run: the certificate of
    the website was not accepted as valid, and the browser did not receive an evaluable page on the target of its
    HTTP redirect.} geo {{count, plural, one {is} other {are}} inconclusive: the consent banner reported a
    location outside the EEA and may behave differently towards visitors from the EEA.} bot {{count, plural, one {is}
    other {are}} inconclusive: the consent banner treated the scan as automated traffic.} reject {{count, plural, one
    {is} other {are}} inconclusive: the rejection in the consent banner could not be triggered or confirmed.} timeout
    {{count, plural, one {was} other {were}} not completed because of the time limit.} error {{count, plural, one
    {was} other {were}} not completed because of an error.} other {{count, plural, one {has} other {have}} no
    conclusive result{hasReasons, select, true {: {reasons}.} other {; the full report gives the reasons.}}}}
  # Checks that reported findings but could not evaluate everything; `titles` are the items of their findings.
  report.overview.partly: >-
    {count, plural, one {One check was} other {# checks were}} evaluated only in part{hasReasons, select, true {:
    {reasons}} other {}}. The findings shown, "{titles}", still apply.
  report.overview.pagesEvaluated: "{reason} ({evaluated} of {observed} pages evaluated)"
  report.overview.banner: >-
    {state, select, recognized {The consent banner was recognised.} firstLayerAmbiguous {The consent banner was
    recognised, but its first layer could not be classified unambiguously; checks that depend on it are not
    conclusively evaluated and should be checked manually.} notRecognized {The consent banner was not
    recognised; checks that depend on it are not conclusively evaluated and should be checked manually.} notFound {No
    consent banner was found on the pages checked; rejection and acceptance were therefore not checked.} notVisible {A
    consent banner is present in the page, but was not shown visibly during the scan; checks that depend on it are not
    conclusively evaluated and should be checked manually.} dialogNotOpened {{accepted, select, true {A consent banner
    is present in the page source but was not opened for the scanner in the visit with rejection (controls disabled);
    rejection was therefore not checked.} other {A consent banner is present in the page source but was not opened
    for the scanner (controls disabled); rejection and acceptance were therefore not checked.}}} other {}}
  report.overview.region: >-
    The region from which the scan ran is not known. Websites can show consent banners and services differently
    depending on the visitor's region; the consent findings apply to this measurement environment and may differ for
    visitors from the EEA.
  report.overview.redirect: >-
    The given address redirects to {host}. For a complete picture, this address should be scanned directly as well.
  # The browser checks ran on the target of the plain-http redirect (`entryHost`) because the certificate of `host` was
  # refused; `finalHost` is where the browser's start page ended.
  report.overview.tlsFallback: >-
    The certificate of the given address {host} was not accepted as valid. Its plain-http address redirects to
    {entryHost}, whose certificate was accepted as valid; the browser checks refer to {finalHost}.
