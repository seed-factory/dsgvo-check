  # `gaps`: the scan ran to its end, but some checks gave no conclusive result (the next sentences say which).
  # `ran`: every check has a result, some only for a part (the next sentence says which and why).
  report.overview.scan: "{state, select, complete {Der Scan wurde vollständig durchgeführt.} gaps {Der Scan ist durchgelaufen, aber nicht jede Prüfung hat ein abschließendes Ergebnis.} ran {Der Scan ist durchgelaufen.} other {Der Scan wurde nur teilweise durchgeführt; nicht alle Seiten oder Prüfungen konnten ausgewertet werden.}}"
  # Checks without a conclusive result, grouped by `cause`; `checks` lists their ids.
  report.overview.open: >-
    {count, plural, one {Eine Prüfung} other {# Prüfungen}} ({checks}) {cause, select, tls-blocked {{count, plural,
