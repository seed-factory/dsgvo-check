    Scanner aber nicht geöffnet (Bedienelemente deaktiviert); Ablehnung und Zustimmung wurden daher nicht geprüft.}}}
    other {}}
  report.overview.region: >-
    Die Region, aus der der Scan lief, ist nicht bekannt. Websites können Einwilligungsbanner und Dienste je nach
    Region des Besuchers unterschiedlich ausspielen; die Befunde zur Einwilligung gelten für diese Messumgebung und
    können für Besucher aus dem EWR abweichen.
  report.overview.redirect: >-
    Die angegebene Adresse leitet auf {host} weiter. Für ein vollständiges Bild sollte auch diese Adresse direkt
    gescannt werden.
  # The browser checks ran on the target of the plain-http redirect (`entryHost`) because the certificate of `host` was
  # refused; `finalHost` is where the browser's start page ended.
  report.overview.tlsFallback: >-
    Das Zertifikat der angegebenen Adresse {host} wurde nicht als gültig angenommen. Ihre unverschlüsselte Adresse
    leitet auf {entryHost} weiter, dessen Zertifikat als gültig angenommen wurde; die Prüfungen im Browser beziehen
    sich auf {finalHost}.
