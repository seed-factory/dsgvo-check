  # Counts of the findings in "Was zu tun ist"; `items`: its points when similar findings share one, else 0.
  report.overview.findings: "{critical, plural, =0 {Es wurden keine kritischen Befunde beobachtet.} one {Es wurde ein kritischer Befund beobachtet.} other {Es wurden # kritische Befunde beobachtet.}}{warning, plural, =0 {} one { Ein Befund sollte geprüft werden.} other { # Befunde sollten geprüft werden.}}{info, plural, =0 {} one { Dazu kommt ein Hinweis zur Information.} other { Dazu kommen # Hinweise zur Information.}}{items, plural, =0 {} one { Gleichartige Befunde sind unten zu einem Punkt zusammengefasst.} other { Gleichartige Befunde sind unten zu # Punkten zusammengefasst.}}"
