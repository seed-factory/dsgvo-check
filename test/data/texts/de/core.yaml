  failure.start-page-unresolved: "{redirected, select, yes {Die Startseite leitet auf einen Host weiter, dessen Name nicht aufgelöst werden kann.} other {Der Name des Hosts der Startseite kann nicht aufgelöst werden.}}"
  failure.start-page-not-public: "{redirected, select, yes {Die Startseite leitet auf eine nicht-öffentliche Adresse weiter; der Scan wurde abgebrochen.} other {Der Host der Startseite löst auf eine nicht-öffentliche Adresse auf; der Scan wurde abgebrochen.}}"
  failure.start-page-unreachable: "Die Startseite konnte nicht geladen werden ({reason})."
  failure.start-page-5xx: "Die Startseite antwortet wiederholt mit HTTP {status}."
  failure.start-page-blocked: "Die Startseite zeigt eine Sperr- oder Prüfseite ({signals})."
  failure.browser-not-installed: "Chromium ist nicht installiert. Bitte „dsgvo-check install“ ausführen."
  failure.sandbox-failed: "Die Chromium-Sandbox konnte nicht gestartet werden (z. B. AppArmor-Einschränkung für User Namespaces oder ein Docker-Profil, das sie sperrt). Möglichkeiten: die Systemeinstellung selbst anpassen oder ausdrücklich --sandbox off setzen.{container, select, yes { Im Docker-Image gilt standardmäßig „--sandbox container“; lassen Sie die Option weg.} other {}}"
  failure.sandbox-container-outside-image: "--sandbox container (DSGVO_CHECK_BROWSER_SANDBOX=container) ist nur im dsgvo-check-Docker-Image erlaubt, wo der gehärtete Container die Isolation übernimmt. Außerhalb des Images require oder bewusst off verwenden."
