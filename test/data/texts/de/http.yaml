# Finding texts (de), module http. ICU-like templates: {param}, {n, plural, one {…} other {…}}, {x, select, …}.
# Keys are the variants of test/data/ruleset (`<checkId>.<variant>`). Wording: "beobachtet", "nicht gefunden in …" —
# no legal verdicts (stop-word test). Draft until reviewed.
draft: true
messages:
  # HDR-01
  HDR-01.hsts-missing:
    title: "HSTS-Header nicht gefunden"
    body: >-
      {problem, select, absent {Der Header Strict-Transport-Security (HSTS) wurde in der HTTPS-Antwort von {url}
      nicht gefunden} other {In der HTTPS-Antwort von {url} wurde ein Strict-Transport-Security-Header beobachtet,
      der keine Wirkung hat ({problem, select, max-age-zero {max-age=0} no-max-age {kein gültiges max-age} other
      {ungültige Syntax}})}}{count, plural, one {} other { (betrifft # Seiten)}}. Ohne wirksames HSTS kann ein
      späterer Aufruf über http:// unverschlüsselt erfolgen, bevor die Umleitung auf https greift. Empfehlung:
      Strict-Transport-Security mit einem max-age von mindestens einem Jahr setzen, z. B. max-age=31536000.
  HDR-01.anti-framing-missing:
    title: "Kein Schutz gegen Einbetten in fremde Seiten (Clickjacking)"
    body: >-
      In der Antwort von {url} wurde weder X-Frame-Options (DENY oder SAMEORIGIN) noch die CSP-Direktive
      frame-ancestors im Header gefunden{count, plural, one {} other { (betrifft # Seiten)}}.{hint, select, meta-csp {
      Die Direktive frame-ancestors steht nur in einem meta-Tag; dort wird sie von Browsern ignoriert.} other {}}
      Empfehlung: X-Frame-Options: SAMEORIGIN oder Content-Security-Policy: frame-ancestors 'self' als HTTP-Header
      setzen.
  HDR-01.referrer-policy-permissive:
    title: "Referrer-Policy gibt vollständige URLs weiter"
    body: >-
      In der Antwort von {url} wurde die Referrer-Policy „{policy}“ beobachtet{count, plural, one {} other {
      (betrifft # Seiten)}}. Damit können vollständige Adressen der besuchten Seiten (einschließlich Pfad und
      Parameter) an Dritte übermittelt werden. Empfehlung: strict-origin-when-cross-origin oder strenger.
  HDR-01.header-missing:
    title: "Header {header} nicht gefunden"
    body: >-
      In der Antwort von {url} wurde {mechanism, select, x-content-type-options {X-Content-Type-Options: nosniff}
      other {der Header {header}}} nicht gefunden{count, plural, one {} other { (betrifft # Seiten)}}.
      {mechanism, select, content-security-policy {Eine CSP begrenzt, welche Skripte und Ressourcen geladen werden
      dürfen. Empfehlung: eine CSP schrittweise einführen, zunächst als Content-Security-Policy-Report-Only.}
      x-content-type-options {Empfehlung: den Header mit dem Wert nosniff setzen.} permissions-policy {Mit ihr lässt
      sich der Zugriff eingebetteter Inhalte auf Kamera, Mikrofon oder Standort begrenzen. Empfehlung: nicht
      benötigte Funktionen abschalten, z. B. camera=(), microphone=(), geolocation=().} referrer-policy {Browser
      verwenden dann ihren Standard (meist strict-origin-when-cross-origin). Empfehlung: die Richtlinie
      ausdrücklich setzen.} other {Empfehlung: die Header-Konfiguration prüfen.}}
  # HDR-02: one finding per (header, product, version); the collector stores only the product/version pairs.
  HDR-02.version-header:
    title: "Softwareversion im Header {header}"
    body: >-
      In der Antwort von {url} wurde der Header {header} beobachtet{count, plural, one {} other { (betrifft #
      Seiten)}}. Er nennt {product} in der Version {version}. Wer die Seite abruft, kann damit ablesen, welche
      Software in welcher Version auf dem Server läuft. Ob für diese Version Schwachstellen bekannt sind, prüft diese
      Meldung nicht. Empfehlung: die Versionsangabe in der Server-Konfiguration abschalten, z. B. expose_php = Off
      (PHP), ServerTokens Prod (Apache) oder server_tokens off (nginx).
  # TLS-01
  TLS-01.https-unavailable:
    title: "Inhalte nur über http nutzbar"
    body: >-
      {downgrade, select, yes {{url} leitet über https zurück auf http um; {page} liefert Inhalte unverschlüsselt
      über http aus.} other {{redirected, select, yes {{url} leitet nur auf {page} weiter (ebenfalls http); dort
      werden Inhalte unverschlüsselt über http ausgeliefert.} other {{url} liefert Inhalte unverschlüsselt über http
      aus.}}}} Über https war {host} {reason, select, unavailable {nicht erreichbar} invalid {nur mit einem
      ungültigen Zertifikat erreichbar} other {nicht nutzbar}}. Seitenaufrufe und Eingaben werden damit
      unverschlüsselt übertragen. Empfehlung: ein gültiges Zertifikat einrichten und http dauerhaft (301 oder 308)
      auf https umleiten.
  # `count` pages of one host served over http with a form; `url` is the first, `action` where its first form sends.
  TLS-01.form-on-http-page:
    title: "Formular auf einer http-Seite"
    body: >-
      {count, plural, one {Auf {url} wurde ein Formular beobachtet, das über unverschlüsseltes http ausgeliefert
      wird} other {Auf # Seiten, die über unverschlüsseltes http ausgeliefert werden, wurden Formulare beobachtet,
      zuerst auf {url}}}{downgrade, select, yes { (die Weiterleitung führt über https zurück auf http)} other
      {}}.{hasAction, select, yes { {count, plural, one {Es sendet} other {Das erste sendet}} seine Eingaben an
      {action}.} other {}} {count, plural, one {Das Formular wurde} other {Die Formulare wurden}} nicht ausgefüllt
      oder abgesendet. Eingaben können so unverschlüsselt übertragen werden. Empfehlung: die Seite nur über https
      ausliefern und http auf https umleiten.
  TLS-01.no-redirect:
    title: "Keine Umleitung von http auf https"
    body: >-
      {downgrade, select, yes {{url} leitet über https zurück auf http um; {page} liefert Inhalte über http aus,}
      other {{redirected, select, yes {{url} leitet nur auf {page} weiter (ebenfalls http); dort werden Inhalte über
      http ausgeliefert,} other {{url} liefert Inhalte über http aus und leitet nicht auf https um,}}}} obwohl
      {host} über https erreichbar ist. Wer die Adresse mit http:// aufruft, bleibt auf der unverschlüsselten Seite.
      Empfehlung: http dauerhaft (301 oder 308) auf https desselben Hosts umleiten.
  TLS-01.client-side-redirect-only:
    title: "Umleitung auf https nur im Seiteninhalt"
    body: >-
      {redirected, select, yes {{url} leitet nur auf {page} weiter (ebenfalls http). Diese Seite leitet} other
      {{url} leitet}} nicht per HTTP-Statuscode auf https um, sondern erst im Seiteninhalt ({kind, select, meta
      {Meta-Refresh} js {JavaScript} other {Seiteninhalt}}). Bis dahin wird die Seite unverschlüsselt geladen.
      Empfehlung: serverseitige Umleitung mit 301 oder 308.
  TLS-01.redirect-chain-detail:
    title: >-
      {reason, select, other-host {Umleitung von http direkt auf einen anderen Host} http-first-hop {Umleitung auf
      https über einen Umweg} other {Umleitung von http nicht direkt auf https desselben Hosts}}
    body: >-
      {reason, select, other-host {Die erste Umleitung von {url} führt auf {location} (anderer Host); https auf
      {host} selbst wird dabei übersprungen.} other {Die erste Umleitung von {url} führt auf {location}; https wird
      erst danach erreicht.}} Für die HSTS-Preload-Liste wird eine direkte Umleitung auf https desselben Hosts
      erwartet.
  # Same-site links of the pages whose href asks for http://; `httpState` is what the http probe of the linked host saw.
  TLS-01.internal-http-link:
    title: "Link auf eine http-Adresse der eigenen Website"
    body: >-
      {count, plural, one {Auf {page} verweist} other {Auf # Seiten verweist}} ein Link{hasText, select, yes {
      („{text}“)} other {}} auf {href}{links, plural, one {} other { (insgesamt # Links auf http-Adressen von
      {host})}}{visible, select, no {; der Link war beim Lesen der Seite nicht sichtbar{region, select, banner {, er
      steht im Bereich des Einwilligungsbanners} other {}}} other {}}. Ein Klick darauf fordert die Seite über
      unverschlüsseltes http an. {httpState, select, served {{host} liefert unter http:// eine Seite aus und leitet
      nicht per HTTP-Statuscode auf https um.} unknown {Ob {host} unter http:// auf https umleitet, ließ sich beim
      Scan nicht feststellen.} other {Ob {host} unter http:// auf https umleitet, wurde nicht geprüft: Der Scan fragt
      nur die angegebene Adresse, www und die Domain selbst ab.}} Empfehlung: den Link auf https umstellen{httpState,
      select, served { und http dauerhaft auf https umleiten} other {}}.
  TLS-01.internal-http-link-upgraded:
    title: "Link auf eine http-Adresse, die auf https umleitet"
    body: >-
      {count, plural, one {Auf {page} verweist} other {Auf # Seiten verweist}} ein Link{hasText, select, yes {
      („{text}“)} other {}} auf {href}{links, plural, one {} other { (insgesamt # Links auf http-Adressen von
      {host})}}{visible, select, no {; der Link war beim Lesen der Seite nicht sichtbar{region, select, banner {, er
      steht im Bereich des Einwilligungsbanners} other {}}} other {}}. Ein Klick darauf fordert die Seite zunächst
      über unverschlüsseltes http an; {host} leitet dann auf {location} um. Ein wirksamer
      Strict-Transport-Security-Header (HSTS), mit dem Browser spätere Aufrufe gleich über https senden, wurde in den
      https-Antworten von {host} nicht gefunden. Empfehlung: den Link auf https umstellen.
  # TLS-02
  TLS-02.certificate-invalid:
    title: "Zertifikat von {host} nicht gültig"
    body: >-
      Die Zertifikatsprüfung für {host} ({trustStore, select, node-bundled {Mozilla-Root-Store der verwendeten
      Node.js-Version} system {Zertifikatsspeicher des Systems} test {Test-Zertifizierungsstelle} other
      {{trustStore}}}) ergab:{expired, select, yes { Das Zertifikat ist seit {notAfter} abgelaufen.} other
      {}}{notYetValid, select, yes { Das Zertifikat ist zum Zeitpunkt des Scans noch nicht gültig.} other
      {}}{nameMismatch, select, yes { {nameSource, select, san {Das Zertifikat ist nicht für {host} ausgestellt,
      sondern für: {names}.} cn {Das Zertifikat enthält keine alternativen Namen (Subject Alternative Name) und nennt
      nur im Feld CN: {names}. Browser prüfen den Hostnamen nur gegen die alternativen Namen.} other {Das Zertifikat
      nennt keinen Hostnamen.}} Das ist typisch für ein Standardzertifikat des Hosters.} other {}}{selfSigned,
      select, yes { Das Zertifikat ist selbst signiert.} other {}}{untrustedRoot, select, yes { Die
      Zertifikatskette (Aussteller: {issuer}) endet nicht bei einer bekannten Stammzertifizierungsstelle.} other
      {}}{otherError, select, yes { Die Prüfung ist fehlgeschlagen ({error}).} other {}} Browser zeigen in der Regel
      eine Warnseite oder blockieren den Aufruf.
      Empfehlung: ein gültiges Zertifikat für {host} einrichten und die automatische Verlängerung prüfen.
  TLS-02.chain-incomplete:
    title: "Zertifikatskette von {host} unvollständig"
    body: >-
      {host} sendet die Zertifikatskette ohne das nötige Zwischenzertifikat (Aussteller: {issuer}). Aktuelle Browser
      ergänzen die Kette meist selbst; andere Clients wie ältere Geräte, Apps oder Skripte brechen die Verbindung ab.
      Empfehlung: die vollständige Kette mit allen Zwischenzertifikaten ausliefern.
  TLS-02.certificate-expiring:
    title: "Zertifikat von {host} läuft bald ab"
    body: >-
      Das TLS-Zertifikat von {host} läuft am {notAfter} ab ({daysLeft, plural, one {noch # Tag} other {noch # Tage}}
      bei einer Laufzeit von {lifetimeDays} Tagen). Empfehlung: die automatische Verlängerung prüfen.
  TLS-02.certificate-expiry-approaching:
    title: "Zertifikat von {host} läuft in Kürze ab"
    body: >-
      Das TLS-Zertifikat von {host} läuft am {notAfter} ab ({daysLeft, plural, one {noch # Tag} other {noch # Tage}}
      bei einer Laufzeit von {lifetimeDays} Tagen). Empfehlung: die automatische Verlängerung prüfen.
  # Raised by the HTTP collector: only the headers HDR-01 and HDR-02 read are missing, the browser may still evaluate
  # the page.
  diagnostic.SCAN-HTTP-BLOCKED:
    title: "Sicherheits-Header nicht bewertet: Zugriff blockiert"
    body: >-
      {count, plural, one {Auf die direkte HTTP-Anfrage an {page} antwortete} other {Auf die direkten HTTP-Anfragen an
      # Seiten ({pages}) antwortete}} eine Zugriffssperre oder Challenge statt der Website; die Sicherheits-Header und
      Versionsangaben {count, plural, one {dieser Seite} other {dieser Seiten}} wurden nicht bewertet.
legalNotes:
  HDR-01:
    text: >-
      Art. 32 und Art. 25 DSGVO verlangen technische Maßnahmen nach dem Stand der Technik; § 19 Abs. 4 TDDDG
      verpflichtet Anbieter digitaler Dienste zu Vorkehrungen gegen unerlaubten Zugriff. Sicherheits-Header sind ein
      verbreiteter technischer Standard. Welche Maßnahme im Einzelfall angemessen ist, hängt vom Risiko ab.
    status: technical
    reviewedAt: null
    reviewBy: null
  HDR-02:
    text: >-
      Art. 32 DSGVO verlangt technische Maßnahmen nach dem Stand der Technik. Eine Versionsangabe im Header ist für
      sich keine Sicherheitslücke; sie zeigt Dritten aber, welche Software in welcher Version eingesetzt wird. Ob
      eine genannte Version bekannte Schwachstellen hat, bewertet diese Prüfung nicht.
    status: technical
    reviewedAt: null
    reviewBy: null
  TLS-01:
    text: >-
      § 19 Abs. 4 S. 3 TDDDG nennt die Anwendung eines als sicher anerkannten Verschlüsselungsverfahrens als
      Vorkehrung; Art. 32 Abs. 1 lit. a DSGVO nennt Verschlüsselung als Maßnahme. Für rein statische Seiten ohne
      Eingaben ist die Einordnung umstritten.
    status: contested
    reviewedAt: null
    reviewBy: null
  TLS-02:
    text: >-
      Transportverschlüsselung im Sinne von Art. 32 DSGVO und § 19 Abs. 4 TDDDG wirkt beim Besucher nur mit einem
      gültigen Zertifikat; bei ungültigem Zertifikat blockieren Browser die Seite oder der Besucher muss eine
      Warnung übergehen.
    status: technical
    reviewedAt: null
    reviewBy: null

# Handlungsempfehlungen je Variante: kurz, konkret, ohne rechtliche Wertung. Vorlagen wie die Befundtexte, mit den
# Parametern des Befunds; auf der ersten Seite teilen sich die Befunde einer Meldung einen Eintrag, ein abweichender
# Parameter ist dort eine Liste und landet in einem select im Zweig other.
actions:
  HDR-01.hsts-missing:
    text: "Senden Sie den Header Strict-Transport-Security mit einem sinnvollen max-age (zum Beispiel über die Webserver-Konfiguration)."
  HDR-01.anti-framing-missing:
    text: "Setzen Sie im Webserver den Header X-Frame-Options oder die CSP-Direktive frame-ancestors, damit fremde Seiten Ihre Seite nicht einbetten."
  HDR-01.referrer-policy-permissive:
    text: "Setzen Sie die Referrer-Policy auf einen restriktiveren Wert, zum Beispiel strict-origin-when-cross-origin."
  # One finding per header; several findings of the front page share the `other` branch with the list of headers.
  HDR-01.header-missing:
    text: >-
      {mechanism, select, content-security-policy {Führen Sie eine Content-Security-Policy schrittweise ein: zuerst
      als Header Content-Security-Policy-Report-Only, nach Prüfung der Meldungen als Content-Security-Policy.}
      x-content-type-options {Setzen Sie in der Webserver-Konfiguration den Header X-Content-Type-Options mit dem
      Wert nosniff.} permissions-policy {Setzen Sie in der Webserver-Konfiguration den Header Permissions-Policy und
      schalten Sie nicht benötigte Funktionen ab, zum Beispiel camera=(), microphone=(), geolocation=().}
      referrer-policy {Setzen Sie in der Webserver-Konfiguration den Header Referrer-Policy, zum Beispiel auf
      strict-origin-when-cross-origin.} other {Ergänzen Sie in der Webserver-Konfiguration die Header {header};
      passende Werte nennt der ausführliche Bericht.}}
  HDR-02.version-header:
    text: >-
      Schalten Sie die Versionsangabe in der Server-Konfiguration ab, zum Beispiel mit expose_php = Off (PHP),
      ServerTokens Prod (Apache) oder server_tokens off (nginx).
  TLS-01.https-unavailable:
    text: "Richten Sie für die Seite ein gültiges Zertifikat ein und liefern Sie sie ausschließlich über https aus."
  TLS-01.form-on-http-page:
    text: "Liefern Sie Seiten mit Formularen nur über https aus und leiten Sie http dauerhaft auf https um."
  TLS-01.no-redirect:
    text: "Richten Sie im Webserver eine dauerhafte Weiterleitung (301 oder 308) von http auf https desselben Hosts ein."
  TLS-01.client-side-redirect-only:
    text: "Leiten Sie auf Serverebene per Statuscode 301 auf https um, statt erst im Seiteninhalt."
  TLS-01.redirect-chain-detail:
    text: >-
      {reason, select, other-host {Wenn die Domain in die HSTS-Preload-Liste aufgenommen werden soll: Leiten Sie
      http zuerst auf https desselben Hosts um (mit gültigem Zertifikat) und erst von dort auf den anderen Host.}
      http-first-hop {Leiten Sie http im ersten Schritt direkt auf https desselben Hosts um, ohne Zwischenschritt
      über http.} other {Leiten Sie http im ersten Schritt auf https desselben Hosts um; weitere Umleitungen erst
      danach.}}
  TLS-01.internal-http-link:
    text: "Stellen Sie Links auf eigene Seiten auf https oder relative Adressen um und leiten Sie http dauerhaft auf https um."
  TLS-01.internal-http-link-upgraded:
    text: "Stellen Sie die Links auf https um und senden Sie auf dem verlinkten Host den Header Strict-Transport-Security."
  TLS-02.certificate-invalid:
    text: >-
      {reason, select, expired {Erneuern Sie das Zertifikat und prüfen Sie, ob die automatische Verlängerung
      funktioniert.} not-yet-valid {Prüfen Sie den Gültigkeitsbeginn des Zertifikats und die Uhrzeit des Servers.}
      name-mismatch {Richten Sie für jeden betroffenen Host ein Zertifikat ein, das dessen Namen enthält, zum
      Beispiel über Ihren Hoster.} self-signed {Ersetzen Sie das selbst signierte Zertifikat durch eines einer
      anerkannten Zertifizierungsstelle.} untrusted-root {Verwenden Sie ein Zertifikat einer anerkannten
      Zertifizierungsstelle und liefern Sie die vollständige Kette aus.} other {Erneuern Sie das Zertifikat oder
      korrigieren Sie die Konfiguration, sodass Browser es ohne Warnung akzeptieren.}}
  TLS-02.chain-incomplete:
    text: "Hinterlegen Sie auf dem Server die vollständige Zertifikatskette inklusive Zwischenzertifikat."
  TLS-02.certificate-expiring:
    text: "Erneuern Sie das Zertifikat jetzt und prüfen Sie, ob die automatische Verlängerung funktioniert."
  TLS-02.certificate-expiry-approaching:
    text: "Prüfen Sie, ob die automatische Verlängerung des Zertifikats eingerichtet ist und rechtzeitig läuft."
