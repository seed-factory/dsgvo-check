# Befundtexte (de), Modul browser. ICU-ähnliche Vorlagen: {param}, plural, select.
# Formulierungen: "beobachtet", "nicht gefunden in …", keine rechtlichen Bewertungen (Stoppwort-Test).
# Titel und Handlungsempfehlungen gelten auch für die Zusammenfassung mehrerer Befunde: ein abweichender Parameter
# wird dort zur Liste ("A, B und 2 weitere"), Zahlen werden addiert. Darum steht ein Name am Ende nach einem
# Doppelpunkt, und `other` einer Auswahl ist der gemischte Fall.
# Textentwurf: alle Texte sind Entwürfe und müssen vom Auftraggeber geprüft werden.
draft: true
messages:
  # CONSENT-01
  CONSENT-01.tracking-completed:
    title: "{requestCount, plural, one {Anfrage} other {Anfragen}} mit dauerhafter Kennung vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde eine abgeschlossene Anfrage an {service} ({host}) mit einer dauerhaften Kennung beobachtet
      ({identifierKind, select, stored-match {Abgleich mit einem gespeicherten Cookie oder Speichereintrag}
      sent-cookie {mit der Anfrage gesendetes Cookie, laut Dienstekatalog eine Kennung} persistent-param {Parameter
      laut Signatur im Dienstekatalog} user-supplied {Nutzer- oder Klickkennung im Parameter} other
      {{identifierKind}}}; {requestCount, plural, one {# Anfrage} other {# Anfragen}} auf {pageCount, plural, one {#
      Seite} other {# Seiten}}). Der Wert der Kennung wurde nicht gespeichert.{embeddedCount, plural, =0 {} one { #
      dieser Anfragen stammte aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.} other { # dieser Anfragen
      stammten aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.}}
  CONSENT-01.cookieless-ping:
    title: "{requestCount, plural, one {Anfrage} other {Anfragen}} ohne dauerhafte Kennung vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde eine Anfrage an {service} ({host}) beobachtet, für die keine dauerhafte Kennung belegt ist
      ({consentModeDenied, select, true {laut übermitteltem Consent-Mode-Signal Speicherung abgelehnt} other {Kennung:
      {identifierKind, select, per-load {nicht als dauerhaft belegt} other {keine erkannt}}}}; {requestCount, plural,
      one {# Anfrage} other {# Anfragen}} auf {pageCount, plural, one {# Seite} other {# Seiten}}). Ob eine solche
      Anfrage ein Zugriff im Sinne von § 25 TDDDG ist, wurde nicht bewertet.{embeddedCount, plural, =0 {} one { #
      dieser Anfragen stammte aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.} other { # dieser Anfragen
      stammten aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.}}
  CONSENT-01.first-party-proxy:
    title: "Eigener Endpunkt mit Tracking-Signatur vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde eine Anfrage an den eigenen Host {host} beobachtet, deren Pfad und Parameter der Signatur von {service} im
      Dienstekatalog entsprechen (z. B. serverseitiges Tagging oder Tag-Gateway). Eine serverseitige Weiterleitung ist
      passiv nicht feststellbar.
  CONSENT-01.library-loaded:
    title: "Vor einer Interaktion geladen: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde eine Bibliothek oder ein Inhalt von {service} ({host}) geladen ({pageCount, plural, one {# Seite} other {#
      Seiten}}). Ein zugehöriger Ereignisversand wurde in diesem Beleg nicht festgestellt.{embeddedCount, plural, =0
      {} one { # dieser Anfragen stammte aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.} other { # dieser
      Anfragen stammten aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.}}
  CONSENT-01.third-party-resource:
    title: "{requestCount, plural, one {Drittanbieter-Ressource} other {Drittanbieter-Ressourcen}} vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      {requestCount, plural, one {wurde # Anfrage} other {wurden # Anfragen}} an {service} ({hosts}) beobachtet
      (Kategorie laut Dienstekatalog: {category, select, cdn {Content Delivery Network} payment {Zahlungsdienst}
      consent-provider {Einwilligungsverwaltung} monitoring {Fehleranalyse} other {{category}}}). Die Erforderlichkeit
      wurde nicht bewertet.{embeddedCount, plural, =0 {} one { # dieser Anfragen stammte aus dem Rahmen des
      eingebetteten Dienstes {embeddedIn}.} other { # dieser Anfragen stammten aus dem Rahmen des eingebetteten
      Dienstes {embeddedIn}.}}
  CONSENT-01.unknown-host:
    title: "{requestCount, plural, one {Anfrage} other {Anfragen}} ohne Dienstzuordnung vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      {requestCount, plural, one {wurde # Anfrage} other {wurden # Anfragen}} an {hostCount, plural, one {den Host
      {hosts}} other {# Hosts der Domain {service} ({hosts})}} beobachtet; {requestCount, plural, one {sie wurde}
      other {sie wurden}} keinem Dienst des Dienstekatalogs zugeordnet. Zweck und Anbieter bitte manuell zuordnen.
  CONSENT-01.request-not-completed:
    title: "{requestCount, plural, one {Anfrage} other {Anfragen}} ohne belegte Antwort vor einer Interaktion: {service}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde eine Anfrage an {service} ({host}) gestartet; eine Antwort wurde nicht beobachtet (z. B. vom Browser
      blockiert oder abgebrochen). Ein beantworteter Austausch ist damit nicht belegt.{embeddedCount, plural, =0 {}
      one { # dieser Anfragen stammte aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.} other { # dieser
      Anfragen stammten aus dem Rahmen des eingebetteten Dienstes {embeddedIn}.}}

  # CONSENT-02
  CONSENT-02.tracking-identifier-stored:
    title: "Bekannte Analyse- oder Marketing-Kennung vor einer Interaktion gespeichert: {name}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde die Speicherung von {name} ({storageKind}, {party}) beobachtet. Einordnung als Kennung der Kategorie
      Analyse/Marketing laut {dataset}. Werte wurden nicht gespeichert.
  CONSENT-02.unknown-third-party-persistent:
    title: >-
      {count, plural, one {{allKnown, select, true {Dauerhafter Eintrag von {services}} other {Dauerhafter
      Drittanbieter-Eintrag}} ohne Einordnung als Kennung vor einer Interaktion: {names}} other {# dauerhafte
      {allKnown, select, true {Einträge von {services}} other {Drittanbieter-Einträge}} ohne Einordnung als Kennung
      vor einer Interaktion: {keys}{moreKeys, plural, =0 {} other { und # weitere}}}}
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde die dauerhafte Speicherung von {count, plural, one {# Eintrag} other {# Einträgen}} durch Drittanbieter
      beobachtet, {count, plural, one {der} other {die}} in {dataset} nicht als Analyse- oder Marketing-Kennung
      eingeordnet {count, plural, one {ist} other {sind}}.{knownCount, plural, =0 {} other { Laut Dienstekatalog einem
      Dienst zugeordnet und dort nicht als Kennung geführt: {knownNames}.}}{unknownCount, plural, =0 {} other { Im
      Dienstekatalog nicht geführt: {unknownNames}. Zweck bitte manuell prüfen.}}
  CONSENT-02.unknown-first-party-persistent:
    title: >-
      {count, plural, one {{allKnown, select, true {Dauerhafter Eintrag von {services}} other {Dauerhafter Eintrag}}
      ohne Einordnung als Kennung vor einer Interaktion: {names}} other {# dauerhafte {allKnown, select, true
      {Einträge von {services}} other {Einträge}} ohne Einordnung als Kennung vor einer Interaktion: {keys}{moreKeys,
      plural, =0 {} other { und # weitere}}}}
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde die dauerhafte Speicherung von {count, plural, one {# Eintrag} other {# Einträgen}} der eigenen Domain
      beobachtet, {count, plural, one {der} other {die}} in {dataset} nicht als Analyse- oder Marketing-Kennung
      eingeordnet {count, plural, one {ist} other {sind}}.{knownCount, plural, =0 {} other { Laut Dienstekatalog einem
      Dienst zugeordnet und dort nicht als Kennung geführt: {knownNames}.}}{unknownCount, plural, =0 {} other { Im
      Dienstekatalog nicht geführt: {unknownNames}. Zweck bitte manuell prüfen.}}
  CONSENT-02.cmp-cookie-with-uid:
    title: "Cookie des Einwilligungsbanners mit eindeutiger Kennung: {name}"
    body: >-
      Das Cookie {name} des Einwilligungsbanners ({storageKind}, {party}) enthält eine eindeutige Kennung. Der Wert
      wurde nicht gespeichert. Ob die Kennung für den Nachweis der Auswahl benötigt wird, wurde nicht bewertet.
  CONSENT-02.storage-rejected-or-attempted:
    title: "Speicherversuch vor einer Interaktion nicht übernommen: {name}"
    body: >-
      {bannerFound, select, true {Vor einer Interaktion mit dem Einwilligungsbanner} false {Vor jeder Interaktion
      (kein Einwilligungsbanner gefunden)}
      unrecognized {Vor jeder Interaktion (Einwilligungsbanner beobachtet, aber nicht erkannt)}
      other {Vor jeder Interaktion (Einwilligungsbanner nicht ausgewertet)}}
      wurde ein Versuch beobachtet, {name} ({storageKind}, {party}) zu speichern; der Browser hat die Speicherung
      abgelehnt oder nicht bestätigt. Einordnung als Kennung der Kategorie Analyse/Marketing laut {dataset}.

  # CONSENT-03
  CONSENT-03.no-banner-strong-tracking:
    title: "Kein Einwilligungsbanner gefunden; Analyse- oder Marketing-Kennung beobachtet"
    body: >-
      Auf {pageCount, plural, one {# auswertbaren geprüften Seite} other {# auswertbaren geprüften Seiten}} wurde
      kein Einwilligungsbanner gefunden. Gleichzeitig wurden vor jeder Interaktion Anfragen mit dauerhafter Kennung
      oder gespeicherte Analyse- oder Marketing-Kennungen beobachtet. Beteiligte Dienste laut Dienstekatalog:
      {services}.{storedCount, plural, =0 {} one { Gespeichert wurde: {stored}.} other { Gespeichert wurden:
      {stored}.}} Egress-Region: {regionAsserted, select, true {EWR laut Nutzerangabe} other {nicht angegeben}}.
  CONSENT-03.no-banner-consent-services:
    title: "Kein Einwilligungsbanner gefunden; Analyse-, Marketing- oder eingebettete Dienste geladen"
    body: >-
      Auf {pageCount, plural, one {# auswertbaren geprüften Seite} other {# auswertbaren geprüften Seiten}} wurde
      kein Einwilligungsbanner gefunden. Gleichzeitig wurden vor jeder Interaktion Dienste beobachtet, die laut
      Dienstekatalog zu den Kategorien Analyse, Marketing oder eingebettete Inhalte gehören: {services}.{storedCount,
      plural, =0 { Außer Einträgen auf der Allowlist wurde keine Speicherung von Analyse- oder Marketing-Kennungen
      oder durch eingebettete Dienste beobachtet.} one { Gespeichert wurde: {stored}.} other { Gespeichert wurden: {stored}.}} Egress-Region:
      {regionAsserted, select, true {EWR laut Nutzerangabe} other {nicht angegeben}}.

  # CONSENT-04
  CONSENT-04.blocking-no-reject:
    title: "Blockierender Dialog ohne Ablehnoption auf der ersten Ebene"
    body: >-
      Der Einwilligungsdialog ({cmp}) blockierte die Seitennutzung. Auf der ersten sichtbaren Ebene wurde eine
      Zustimmungsoption, aber keine unmittelbar bedienbare Ablehnoption gefunden.
  CONSENT-04.close-means-accept:
    title: "Schließen des Dialogs gilt als Zustimmung"
    body: "Laut ausgelesener Konfiguration von {cmp} führt das Schließen des Dialogs zur Zustimmung."
  CONSENT-04.reject-not-actionable:
    title: "Ablehnoption auf dem ersten Bildschirm nicht bedienbar"
    body: >-
      Eine Ablehnoption von {cmp} wurde gefunden, war auf dem ersten Bildschirm jedoch nicht unmittelbar bedienbar
      (z. B. verdeckt oder außerhalb des sichtbaren Bereichs).
  CONSENT-04.reject-ineffective:
    title: "Ablehnung nicht bestätigt"
    body: "Nach Betätigung der Ablehnoption von {cmp} wurde kein bestätigter Ablehnzustand festgestellt."
  CONSENT-04.consent-without-action:
    title: "CMP meldet Status „granted“ ohne Auswahl im Dialog"
    body: >-
      Ohne Auswahl im Dialog meldete {cmp} den Status „granted“ für optionale Kategorien (Herkunft laut CMP:
      Ausgangszustand oder gespeicherter Zustand).
  CONSENT-04.reject-as-link:
    title: "Ablehnoption als Link gestaltet"
    body: >-
      Die Ablehnoption von {cmp} ist als Link gestaltet. Ob sie gleichwertig zur Zustimmung dargestellt ist, wurde
      nicht automatisch bewertet; bitte manuell prüfen.
  CONSENT-04.nonblocking-no-reject:
    title: "Keine Ablehnoption auf der ersten Ebene (nicht blockierend)"
    body: >-
      Der Einwilligungsdialog ({cmp}) blockierte die Seite nicht; auf der ersten Ebene wurde keine Ablehnoption
      gefunden. Bitte manuell prüfen.
  CONSENT-04.no-choice-at-first-layer:
    title: "Keine Auswahl auf der ersten Ebene"
    body: >-
      Der Einwilligungsdialog ({cmp}) blockierte die Seite; auf der ersten Ebene wurden weder eine Zustimmungs- noch
      eine Ablehnoption gefunden, nur weitere Einstellungen. Bitte manuell prüfen.
  CONSENT-04.pur-abo:
    title: "Pur-Abo-Modell erkannt"
    body: "Ein Modell aus Zustimmung oder kostenpflichtigem Abonnement ({cmp}) wurde erkannt. Bitte manuell prüfen."
  CONSENT-04.banner-not-recognized:
    title: "Banner nicht erkannt"
    body: >-
      Banner nicht erkannt. Die Gestaltung und Funktion der Optionen wurden nicht abschließend ausgewertet; die
      gemessenen Fakten stehen zur manuellen Prüfung in den Belegen.
  CONSENT-04.cmp-not-supported:
    title: "CMP {cmp} erkannt, nicht unterstützt"
    body: "CMP {cmp} erkannt, nicht unterstützt. Die Gestaltung und Funktion der Optionen wurden nicht ausgewertet."

  # CONSENT-05
  CONSENT-05.tracking-after-reject:
    title: >-
      {kind, select, storage {Analyse- oder Marketing-Kennung nach bestätigter Ablehnung gespeichert: {service}}
      request {Anfragen mit dauerhafter Kennung nach bestätigter Ablehnung: {service}} both {Kennungen nach
      bestätigter Ablehnung gesendet und gespeichert: {service}} other {Kennungen nach bestätigter Ablehnung
      gesendet oder gespeichert: {service}}}
    body: >-
      {kind, select, storage {Nach bestätigter Ablehnung wurde eine neue Speicherung von {name} ({service})
      beobachtet; der Browser hat den Eintrag nach dem Klick angenommen. Werte wurden nicht gespeichert.} other {Nach
      bestätigter Ablehnung und erneutem Laden wurde eine neue, nach dem Klick gestartete Anfrage an {service}
      ({host}) mit einer dauerhaften Kennung beobachtet ({pageCount, plural, one {# Seite} other {#
      Seiten}}).{kind, select, both { Außerdem wurde nach dem Klick die Speicherung von {name} beobachtet; Werte
      wurden nicht gespeichert.} other {}} Anfragen des Einwilligungsbanners zur Aktualisierung des Status sind
      ausgenommen.}}
  CONSENT-05.cookieless-ping-after-reject:
    title: "Anfragen ohne dauerhafte Kennung nach Ablehnung: {service}"
    body: >-
      Nach bestätigter Ablehnung wurde eine nach dem Klick gestartete Anfrage an {service} ({host}) ohne belegte
      dauerhafte Kennung beobachtet ({consentModeDenied, select, true {laut übermitteltem Consent-Mode-Signal
      Speicherung abgelehnt} other {Kennung nicht als dauerhaft belegt}}; {pageCount, plural, one {# Seite} other
      {# Seiten}}).
  CONSENT-05.connect-only-after-reject:
    title: "Nur Verbindungsaufbau nach Ablehnung: {host}"
    body: >-
      Nach bestätigter Ablehnung wurde ein Verbindungsaufbau zu {host} ({service}) protokolliert; ein konkreter
      Ereignisversand wurde daraus nicht festgestellt.

  # TRACK-01
  TRACK-01.service-inventory:
    title: "Inventar der beobachteten Dienste: {service}"
    body: >-
      {service} wurde beobachtet. Zustand je Zeitpunkt: vor einer Interaktion: {stageBeforeInteraction, select,
      loaded {geladen} initialised {initialisiert} event-sent {Ereignis gesendet} not-checked {nicht geprüft}
      other {nicht gefunden}}; nach Ablehnung: {stageAfterReject, select, loaded {geladen} initialised
      {initialisiert} event-sent {Ereignis gesendet} not-checked {nicht geprüft} other {nicht gefunden}}; nach
      Zustimmung: {stageAfterAccept, select, loaded {geladen} initialised {initialisiert} event-sent
      {Ereignis gesendet} not-checked {nicht geprüft} other {nicht gefunden}}.{initialisedWithoutRequest, select, true
      { „Initialisiert“ ohne Anfrage zu einem Zeitpunkt beruht auf einer dann gespeicherten Kennung des Dienstes.}
      other {}}{notChecked, select, true { „Nicht geprüft“ steht für einen Zeitpunkt, zu dem keine Ablehnung bzw.
      Zustimmung im Einwilligungsbanner stattfand.} other {}} Die Bewertung des Zeitpunkts erfolgt in den verknüpften
      Befunden.

  # EMBED-01
  EMBED-01.fonts-loaded:
    title: "Externe Schriftarten geladen: {service}"
    body: >-
      {fontService, select, true {Schriftdateien oder Stylesheets von {service} wurden von einem externen Server
      geladen} other {Schriftdateien wurden vom Drittanbieter-Server {service} geladen}}, Zeitpunkt: {afterReject,
      select, true
      {vor einer Interaktion mit dem Einwilligungsbanner bzw. nach Ablehnung} other {{bannerFound, select, true {vor
      einer Interaktion mit dem Einwilligungsbanner} false {vor jeder Interaktion, kein Einwilligungsbanner
      gefunden}
      unrecognized {vor jeder Interaktion, Einwilligungsbanner beobachtet, aber nicht erkannt}
      other {vor jeder Interaktion, Einwilligungsbanner nicht ausgewertet}}}} ({pageCount, plural, one {#
      Seite} other {# Seiten}}).
  EMBED-01.preconnect-only:
    title: >-
      {observed, select, hint {Nur Verbindungsvorbereitung zu einem Schriftdienst: {service}} attempt {Nicht
      abgeschlossener Schriftabruf: {service}} other {Verbindungsvorbereitung oder nicht abgeschlossener Schriftabruf:
      {service}}}
    body: >-
      Zu {service} wurde nur eine Verbindungsvorbereitung (preconnect/dns-prefetch) oder ein nicht abgeschlossener
      Abruf beobachtet; ein abgeschlossener Abruf von Schriftdateien wurde nicht festgestellt.

  # EMBED-02
  EMBED-02.maps-loaded:
    title: "Externer Kartendienst geladen: {service}"
    body: >-
      Ein externer Kartendienst von {service} wurde als {integrationType, select, iframe {eingebettete Karte
      (iframe)} js-api {JavaScript-API} static {statisches Kartenbild} tiles {Kartenkacheln} other {Karteninhalt}}
      geladen, Zeitpunkt: {afterReject, select, true {vor einer Interaktion mit dem Einwilligungsbanner bzw. nach
      Ablehnung} other {{bannerFound, select, true {vor einer Interaktion mit dem Einwilligungsbanner} false {vor
      jeder Interaktion, kein Einwilligungsbanner gefunden}
      unrecognized {vor jeder Interaktion, Einwilligungsbanner beobachtet, aber nicht erkannt}
      other {vor jeder Interaktion, Einwilligungsbanner nicht
      ausgewertet}}}} ({pageCount, plural, one {# Seite} other {# Seiten}}).{frameResourceCount, plural, =0 {} one {
      Dazu zählt # Anfrage des Kartenrahmens an Schriftdienste oder Hilfshosts.} other { Dazu zählen # Anfragen des
      Kartenrahmens an Schriftdienste oder Hilfshosts.}}

  # LEGAL-01
  LEGAL-01.document-not-found:
    title: "{documentKind, select, impressum {Impressum} privacy {Datenschutzerklärung} other {Impressum und Datenschutzerklärung}} nicht gefunden"
    body: >-
      {documentKind, select, impressum {Ein Impressum} other {Eine Datenschutzerklärung}} wurde auf
      {pageTotal, plural, one {der # geprüften Seite} other {den # geprüften Seiten}} nicht per Link gefunden.
      {hopChecked, select, true {Auch über eine geprüfte Zwischenseite (z. B. Kontakt) wurde {documentKind, select,
      impressum {es} other {sie}} nicht gefunden.} other {Eine Zwischenseite (z. B. Kontakt) wurde nicht geprüft.}}{fallbackChecked,
      select, true { Unter den üblichen Pfaden wurde {documentKind, select, impressum {es} other {sie}} ebenfalls nicht
      gefunden.} other {}}{inOtherDocument, select, true { Die gefundene Datenschutzerklärung
      ({otherDocument}) enthält einen Abschnitt mit der Überschrift „{otherHeading}“; ein Link, der ihn als Impressum
      benennt, wurde nicht gefunden.} other {}}
  LEGAL-01.links-broken:
    title: "{documentKind, select, impressum {Links auf das Impressum führen} privacy {Links auf die Datenschutzerklärung führen} other {Links auf Impressum und Datenschutzerklärung führen}} auf Fehlerseiten"
    body: >-
      Links auf {documentKind, select, impressum {das Impressum} other {die Datenschutzerklärung}} führen auf
      Fehlerseiten (4xx, Soft-404 oder Seite ohne erkennbaren Inhalt). Über eine geprüfte Zwischenseite erreichbar:
      {reachableViaHop, select, true {ja} other {nein}}.
  LEGAL-01.link-missing-on-some-pages:
    title: "{documentKind, select, impressum {Link auf das Impressum} privacy {Link auf die Datenschutzerklärung} other {Links auf Impressum und Datenschutzerklärung}} nicht auf allen Seiten"
    body: >-
      Ein Link auf {documentKind, select, impressum {das Impressum} other {die Datenschutzerklärung}} wurde auf
      {missingCount} von {pageTotal} geprüften Seiten nicht gefunden.
  LEGAL-01.reachable-via-intermediate:
    title: "{documentKind, select, impressum {Impressum} privacy {Datenschutzerklärung} other {Impressum und Datenschutzerklärung}} nur über Zwischenseite oder Standardpfad erreichbar"
    body: >-
      {documentKind, select, impressum {Das Impressum} other {Die Datenschutzerklärung}} wurde auf den geprüften
      Seiten nicht per direktem Link gefunden, sondern nur {foundVia, select, hop {über eine Zwischenseite (z. B.
      Kontakt)} fallback {über einen üblichen Pfad} other {auf anderem Weg}}.
  LEGAL-01.footer-covered-by-banner:
    title: "Seitenfuß vom Einwilligungsbanner verdeckt"
    body: >-
      Das Einwilligungsbanner verdeckte den Seitenfuß; im Banner selbst wurde kein Link auf
      {documentKind, select, impressum {das Impressum} other {die Datenschutzerklärung}} gefunden.
  LEGAL-01.unresolved:
    title: "{documentKind, select, impressum {Linkziel für das Impressum} privacy {Linkziel für die Datenschutzerklärung} other {Linkziele für Impressum und Datenschutzerklärung}} nicht aufgelöst"
    body: >-
