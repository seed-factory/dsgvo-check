# Core UI strings, disclaimer and diagnostics. Draft texts until reviewed.
draft: true
ui:
  disclaimer: >-
    This report describes technical observations of an automated, passive scan at the stated time. It is not
    legal advice and not a legal assessment. If a check has no finding, this does not mean that a requirement
    is met. Results may depend on location, time, consent banner configuration and detection as an automated
    visitor.
  # Further paragraphs of the disclaimer (wording guide §6). src/reporters/disclaimer.ts renders each conditional
  # paragraph only when its condition holds in the report, so the text stays true; `data` and `usage` always.
  disclaimer.data: >-
    Values of cookies, Web Storage entries and consent strings are stored neither in clear text nor as a checksum;
    query parameters in URLs are replaced by “[redacted]” except for an allowlist.
  disclaimer.screenshots: >-
    Screenshots of the banner area were enabled (can be turned off with --no-screenshots). Only a section of the
    first screen before any interaction is captured, and only when the banner area is unambiguous and takes up at
    most half of the viewport. The images are stored as evidence in the report directory and may contain content of
    the website.
  disclaimer.bannerNotRecognized: >-
    The consent banner could not be attributed to a supported provider. Checks that depend on recognition were not
    fully evaluated. A banner that was not recognised is not the same as a missing banner.
  disclaimer.botOrGeo: >-
    The consent banner treated the scan as automated traffic or as a visit from outside its target region. The
    affected checks ({checks}) are not assessable; the website may behave differently towards visitors.
  disclaimer.egressUnknown: >-
    The region from which the scan was run is not known. Websites can adapt their behaviour to the visitor's region;
    observations of consent banners therefore apply only to the actual measurement environment.
  disclaimer.egressAsserted: >-
    The egress region “{region, select, eea {EEA} de {Germany} other {{region}}}” is based on a user statement
    (--assume-region) and was not verified by the scanner.
  disclaimer.proxy: >-
    The scan ran through a proxy (--proxy). Location and region of the proxy were not verified by the scanner.
  disclaimer.sandboxOff: >-
    The browser ran without the Chromium sandbox (--sandbox off). This affects the isolation of the measurement
    environment, not the results.
  disclaimer.incomplete: >-
    {status, select, failed {The scan was not performed} other {The scan was not completed}}{hasReasons, select, true
    { (reasons: {reasons})} other {}}. Checks that did not complete are marked with their status in the report;
    observations already collected are kept.
  disclaimer.phaseC: >-
    Phase C (acceptance in the consent banner) was performed: it discloses the scanning machine's IP address to the
    third parties whose resources the website loads after acceptance.
  disclaimer.draft: "Draft text – the texts of this report have not yet been legally reviewed."
  disclaimer.usage: >-
    dsgvo-check is intended for checking your own websites or websites you manage on behalf of others; reports about
    third-party websites are not intended for publication. The software is provided under the Apache License 2.0
    without warranty.
  # Usage notes for `--help` and the project README (wording guide §6, 5.7).
  usageNotes.title: "Usage notes"
  usageNotes: >-
    dsgvo-check is intended for checking your own websites or websites you manage on behalf of others; reports about
    third-party websites are not intended for publication. HTTP requests of the scanner carry the User-Agent
    "dsgvo-check/{version} (+https://github.com/seed-factory/dsgvo-check; passive DSGVO/security check)"; the browser
    identifies as Chrome with the same token. TLS handshakes and DNS queries carry no User-Agent. Phase C discloses
    the scanning machine's IP address to the third parties whose resources the website loads after acceptance
    in the banner. With --proxy, DNS queries go directly to the resolver, not through the proxy.
  console.title: "dsgvo-check {version} – report for {target}"
  console.draftStamp: "Draft text"
  console.status.complete: "Scan complete"
  console.status.partial: "Scan partially completed"
  console.failed: "Scan not performed: {message} ({code})"
  # Reason of a scan that the global timeout ended before the start page was captured (src/scan.ts).
  failure.scan-timeout: "Global time limit (--timeout {seconds} s) reached before the start page was fully captured in phase A."
  failure.browser-no-handover: "Global time limit (--timeout {seconds} s) reached. The browser collector handed over no data afterwards; whether the start page was captured is not known."
  # Reasons of a failed scan (`scan.failure.code`), thrown by src/scan.ts, src/cli.ts, src/core/url.ts and the collectors.
  failure.target-missing: "No target URL given."
  failure.target-invalid-url: "Invalid URL: {url}"
  failure.target-unsupported-scheme: "Only http(s) URLs are supported: {scheme}"
  failure.target-credentials: "Credentials in the URL are not allowed."
  failure.invalid-duration: "Invalid duration: {value}"
  failure.invalid-fail-on: "Invalid value for --fail-on: {value}"
  failure.invalid-max-pages: "Invalid value for --max-pages: {value}"
  failure.invalid-timeout: "Invalid value for --timeout: {value}"
  failure.invalid-proxy: "Invalid proxy URL (only http:// is supported)."
  failure.invalid-cli-option: "Invalid value for {option}: {value}"
  failure.target-nxdomain: "Target host {host} could not be resolved ({code})."
  failure.target-dns-error: "Target host {host} could not be resolved ({code})."
  failure.target-not-public: "Target host {host} resolves to non-public addresses only; the scan is intended for public websites only."
  failure.target-mixed-addresses: "Target host {host} resolves to non-public addresses as well as public ones ({addresses}); the scan is intended for public websites only."
  failure.snapshot-unreadable: "Snapshot {file} cannot be read: {message}"
  failure.snapshot-invalid: "Snapshot {file} has no supported format."
  failure.unknown-check: "Unknown check(s) in --checks: {checks}"
  failure.locked-override: "These variants cannot be overridden: {variants}"
  failure.start-page-unresolved: "{redirected, select, yes {The start page redirects to a host whose name cannot be resolved.} other {The name of the start page host cannot be resolved.}}"
  failure.start-page-not-public: "{redirected, select, yes {The start page redirects to a non-public address; the scan was aborted.} other {The start page host resolves to a non-public address; the scan was aborted.}}"
  failure.start-page-unreachable: "The start page could not be loaded ({reason})."
  failure.start-page-5xx: "The start page repeatedly answers with HTTP {status}."
  failure.start-page-blocked: "The start page shows a blocking or verification page ({signals})."
  failure.browser-not-installed: 'Chromium is not installed. Please run "dsgvo-check install".'
  failure.sandbox-failed: 'The Chromium sandbox could not be started (for example an AppArmor restriction on user namespaces, or Docker without a seccomp profile). Options: use the Docker image with the bundled seccomp profile, adjust the system setting yourself, or set --sandbox off explicitly.{container, select, yes { In the Docker image: export the profile with "docker run --rm <image> seccomp-profile > dsgvo-check-seccomp.json" and start the container like this: "docker run --rm --cap-drop=ALL --security-opt no-new-privileges --security-opt seccomp=dsgvo-check-seccomp.json <image> <url>".} other {}}'
  failure.browser-launch-failed: "Chromium could not be started: {message}"
  failure.interrupted: "Aborted by {signal}"
  failure.watchdog-timeout: "Time limit including the reserve exceeded"
  failure.internal-error: "Internal error: {message}"
  # Help of the scan and install commands (src/cli.ts; --help is always German).
  cli.description: "Passive scan of a website for signs of DSGVO/TDDDG/DDG issues and basic security problems."
  cli.url: "Target URL (http/https)"
  cli.urlMissing: "Target URL missing."
  cli.failOn: "Threshold for exit code 1: critical|warning|none"
  cli.out: Output directory
  cli.maxPages: maximum number of pages in phase A
  cli.timeout: "global time limit, e.g. 8m, 90s"
  cli.proxy: "HTTP proxy (http://, CONNECT) for browser, HTTP and TLS"
  cli.assumeRegion: "Location as stated by the user: eea|de"
  cli.strict: inconclusive results, sandbox off and an unchecked region lead to exit code 2
  cli.sandbox: "Chromium sandbox: require|off"
  cli.noScreenshots: no screenshots of the banner
  cli.saveSnapshot: save the raw data snapshot
  cli.fromSnapshot: re-evaluate a snapshot without visiting the website
  cli.checks: "only these checks, e.g. EMBED-01,HDR-01"
  cli.verbose: verbose logs on stderr
  cli.install: Download Chromium (Chrome for Testing) for playwright-core
  cli.installWithDeps: "install system dependencies (Linux, needs root)"
  console.duration: "Duration: {seconds} s"
  console.counts: "Findings: {critical} critical · {warning} warning · {info} info"
  console.noFindings: "No findings observed. This does not confirm that requirements are met."
  console.severity.critical: "CRITICAL"
  console.severity.warning: "WARNING"
  console.severity.info: "INFO"
  console.pages: "Pages"
  console.confidence.medium: "Medium-confidence match – please review manually"
  console.confidence.low: "Low-confidence match – please review manually"
  console.checks: "Checks: {total} · completed {completed} · partial {partial} · inconclusive {inconclusive} · not applicable {notApplicable} · skipped {skipped} · error {error}"
  console.diagnostic: "Diagnostic"
  console.exit: "Exit code {code} ({reasons})"
  console.reportWritten: "Report saved: {path}"
  console.reportWriteFailed: "Report could not be written: {path} ({message})"
  console.sandboxOff: "Warning: Chromium sandbox is disabled (--sandbox off)."
messages:
  diagnostic.SCAN-BOTMODE:
    title: "Consent banner behaves as towards a bot"
    body: "The banner gave a direct bot signal ({signal}). Affected checks are inconclusive."
  diagnostic.SCAN-GEO:
    title: "Consent banner reports a location outside the EEA"
    body: "The banner gave a location signal ({signal}). Affected checks are inconclusive."
  diagnostic.SCAN-UNREACHABLE:
    title: "Website not reachable"
    body: "The start page could not be loaded."
  diagnostic.SCAN-BLOCKED:
    title: "Access blocked"
    body: "{count, plural, one {Access to {page} was} other {Access to # pages ({pages}) was}} restricted by an access block or challenge; {count, plural, one {the page was} other {the pages were}} not evaluated for content."
  diagnostic.SCAN-TIMEOUT:
    title: "Time limit reached"
    body: "{count, plural, =0 {The global time limit was reached; observations already collected remain in the report.} one {The global time limit was reached. One check was not completed in full; observations already collected remain in the report.} other {The global time limit was reached. # checks were not completed in full; observations already collected remain in the report.}}"
  diagnostic.SCAN-SANDBOX-OFF:
    title: "Chromium sandbox disabled"
    body: "The browser ran without sandbox (--sandbox off)."
  diagnostic.SCAN-THROTTLED:
    title: "Requests throttled"
    body: "The target host repeatedly answered with 429 or 503. The affected collection is incomplete."
  diagnostic.SCAN-PRIVATE-REQUEST-BLOCKED:
    title: "Navigation blocked by network rule"
    body: "The scanner's network rule blocked {count, plural, one {one navigation} other {# navigations}}: {addressClass}.{unresolved, plural, =0 {} other { Name not resolvable: the local name resolution returned no address{hasLookupCodes, select, true {, resolver error: {lookupCodes}} other {}}.}}{nonPublic, plural, =0 {} other { Private address: the target is in a non-public address range.}} Affected documents were not fetched.{recovered, plural, =0 {} one { One more navigation was blocked at first and loaded after a retry.} other { # more navigations were blocked at first and loaded after a retry.}}"
