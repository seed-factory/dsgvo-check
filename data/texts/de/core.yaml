# Core UI strings, disclaimer and diagnostics. Draft texts: "Textentwurf" until reviewed.
draft: true
ui:
  disclaimer: >-
    Dieser Bericht beschreibt technische Beobachtungen eines automatisierten, passiven Scans zum angegebenen
    Zeitpunkt. Er ist keine Rechtsberatung und keine rechtliche Bewertung. Wenn zu einer Prüfung kein Befund
    vorliegt, bedeutet das nicht, dass eine Anforderung erfüllt ist. Ergebnisse können von Standort, Zeitpunkt,
    Konfiguration des Einwilligungsbanners und der Erkennung als automatisierter Besucher abhängen.
  # Further paragraphs of the disclaimer (wording guide §6). src/reporters/disclaimer.ts renders each conditional
  # paragraph only when its condition holds in the report, so the text stays true; `data` and `usage` always.
  disclaimer.data: >-
    Werte von Cookies, Web-Storage-Einträgen und Consent-Strings werden weder im Klartext noch als Prüfsumme
    gespeichert; Query-Parameter in URLs werden bis auf eine Positivliste durch „[redacted]“ ersetzt.
  disclaimer.screenshots: >-
    Bildschirmfotos des Bannerbereichs waren eingeschaltet (abschaltbar mit --no-screenshots). Aufgenommen wird nur
    ein Ausschnitt des ersten Bildschirms vor jeder Interaktion und nur, wenn der Bannerbereich eindeutig abgrenzbar
    ist und höchstens die Hälfte des Viewports einnimmt. Die Bilder liegen als Belege im Berichtsverzeichnis und
    können Inhalte der Website enthalten.
  disclaimer.bannerNotRecognized: >-
    Das Einwilligungsbanner konnte keinem unterstützten Anbieter zugeordnet werden. Prüfungen, die von der Erkennung
    abhängen, wurden nicht abschließend ausgewertet. Ein nicht erkanntes Banner ist nicht gleichbedeutend mit einem
    fehlenden Banner.
  disclaimer.botOrGeo: >-
    Das Einwilligungsbanner hat den Scan als automatisierten Zugriff oder als Zugriff von außerhalb seiner Zielregion
    behandelt. Die betroffenen Prüfungen ({checks}) wurden als nicht auswertbar eingestuft; das Verhalten der Website
    gegenüber Besuchern kann abweichen.
  disclaimer.egressUnknown: >-
    Die Region, aus der der Scan durchgeführt wurde, ist nicht bekannt. Websites können ihr Verhalten nach der Region
    des Besuchers steuern; Beobachtungen zu Einwilligungsbannern gelten daher nur für die tatsächliche Messumgebung.
  disclaimer.egressAsserted: >-
    Die Egress-Region „{region, select, eea {EWR} de {Deutschland} other {{region}}}“ beruht auf einer Nutzerangabe
    (--assume-region) und wurde vom Scanner nicht geprüft.
  disclaimer.proxy: >-
    Der Scan lief über einen Proxy (--proxy). Standort und Region des Proxys wurden vom Scanner nicht geprüft.
  disclaimer.sandboxOff: >-
    Der Browser wurde ohne Chromium-Sandbox ausgeführt (--sandbox off). Dies betrifft die Isolation der
    Messumgebung, nicht die Ergebnisse.
  disclaimer.incomplete: >-
    {status, select, failed {Der Scan wurde nicht durchgeführt} other {Der Scan wurde nicht vollständig
    durchgeführt}}{hasReasons, select, true { (Gründe: {reasons})} other {}}. Nicht abgeschlossene Prüfungen sind im
    Bericht mit ihrem Status gekennzeichnet; bereits erhobene Beobachtungen bleiben erhalten.
  disclaimer.phaseC: >-
    Phase C (Annahme im Einwilligungsbanner) wurde durchgeführt: Sie übermittelt die IP-Adresse des prüfenden
    Rechners an die Drittanbieter, deren Ressourcen die Website nach der Annahme lädt.
  disclaimer.draft: "Textentwurf – die Texte dieses Berichts sind noch nicht juristisch geprüft."
  disclaimer.usage: >-
    dsgvo-check ist für die Prüfung eigener oder im Auftrag betreuter Websites bestimmt; Berichte über Websites
    Dritter sind nicht zur Veröffentlichung vorgesehen. Die Software wird unter der Apache License 2.0 ohne
    Gewährleistung bereitgestellt.
  # Nutzungshinweise for `--help` and the project README (wording guide §6, 5.7).
  usageNotes.title: "Nutzungshinweise"
  usageNotes: >-
    dsgvo-check ist für die Prüfung eigener oder im Auftrag betreuter Websites bestimmt; Berichte über Websites
    Dritter sind nicht zur Veröffentlichung vorgesehen. HTTP-Anfragen des Scanners tragen den User-Agent
    „dsgvo-check/{version} (+https://github.com/seed-factory/dsgvo-check; passive DSGVO/security check)“; der Browser
    meldet sich als Chrome mit demselben Token. TLS-Verbindungsaufbauten und DNS-Abfragen tragen keinen User-Agent.
    Phase C übermittelt die IP-Adresse des prüfenden Rechners an die Drittanbieter, deren Ressourcen die Website nach
    der Annahme im Banner lädt. Mit --proxy laufen DNS-Abfragen direkt über den Resolver, nicht über den Proxy.
  console.title: "dsgvo-check {version} – Bericht für {target}"
  console.draftStamp: "Textentwurf"
  console.status.complete: "Scan vollständig"
  console.status.partial: "Scan teilweise durchgeführt"
  console.failed: "Scan nicht durchgeführt: {message} ({code})"
  # Reason of a scan that the global timeout ended before the start page was captured (src/scan.ts).
  failure.scan-timeout: "Globales Zeitlimit (--timeout {seconds} s) erreicht, bevor die Startseite in Phase A vollständig erfasst war."
  failure.browser-no-handover: "Globales Zeitlimit (--timeout {seconds} s) erreicht. Der Browser-Kollektor hat danach keine Daten übergeben; ob die Startseite erfasst war, ist nicht bekannt."
  console.duration: "Dauer: {seconds} s"
  console.counts: "Befunde: {critical} kritisch · {warning} Warnung · {info} Hinweis"
  console.noFindings: "Keine Befunde beobachtet. Das ist keine Bestätigung, dass Anforderungen erfüllt sind."
  console.severity.critical: "KRITISCH"
  console.severity.warning: "WARNUNG"
  console.severity.info: "HINWEIS"
  console.pages: "Seiten"
  console.confidence.medium: "Zuordnung mit mittlerer Sicherheit – bitte manuell prüfen"
  console.confidence.low: "Zuordnung mit geringer Sicherheit – bitte manuell prüfen"
  console.checks: "Prüfungen: {total} · abgeschlossen {completed} · teilweise {partial} · nicht eindeutig {inconclusive} · nicht anwendbar {notApplicable} · übersprungen {skipped} · Fehler {error}"
  console.diagnostic: "Diagnose"
  console.exit: "Exit-Code {code} ({reasons})"
  console.reportWritten: "Bericht gespeichert: {path}"
  console.reportWriteFailed: "Bericht konnte nicht geschrieben werden: {path} ({message})"
  console.sandboxOff: "Achtung: Chromium-Sandbox ist ausgeschaltet (--sandbox off)."
messages:
  diagnostic.SCAN-BOTMODE:
    title: "Einwilligungsbanner verhält sich wie gegenüber einem Bot"
    body: "Das Banner hat ein direktes Bot-Signal geliefert ({signal}). Betroffene Prüfungen sind nicht eindeutig."
  diagnostic.SCAN-GEO:
    title: "Einwilligungsbanner meldet einen Standort außerhalb des EWR"
    body: "Das Banner hat ein Standort-Signal geliefert ({signal}). Betroffene Prüfungen sind nicht eindeutig."
  diagnostic.SCAN-UNREACHABLE:
    title: "Website nicht erreichbar"
    body: "Die Startseite konnte nicht geladen werden."
  diagnostic.SCAN-BLOCKED:
    title: "Zugriff blockiert"
    body: "{count, plural, one {Der Zugriff auf {page} wurde} other {Der Zugriff auf # Seiten ({pages}) wurde}} durch eine Zugriffssperre oder Challenge eingeschränkt; {count, plural, one {die Seite wurde} other {die Seiten wurden}} nicht inhaltlich ausgewertet."
  diagnostic.SCAN-TIMEOUT:
    title: "Zeitlimit erreicht"
    body: "{count, plural, =0 {Das globale Zeitlimit wurde erreicht; bereits erfasste Beobachtungen bleiben im Bericht enthalten.} one {Das globale Zeitlimit wurde erreicht. Eine Prüfung wurde nicht vollständig abgeschlossen; bereits erfasste Beobachtungen bleiben im Bericht enthalten.} other {Das globale Zeitlimit wurde erreicht. # Prüfungen wurden nicht vollständig abgeschlossen; bereits erfasste Beobachtungen bleiben im Bericht enthalten.}}"
  diagnostic.SCAN-SANDBOX-OFF:
    title: "Chromium-Sandbox ausgeschaltet"
    body: "Der Browser lief ohne Sandbox (--sandbox off)."
  diagnostic.SCAN-THROTTLED:
    title: "Anfragen gedrosselt"
    body: "Der Zielhost antwortete wiederholt mit 429 oder 503. Die betroffene Erfassung ist unvollständig."
  diagnostic.SCAN-PRIVATE-REQUEST-BLOCKED:
    title: "Navigation durch Netzwerkregel blockiert"
    body: "Die Netzwerkregel des Scanners hat {count, plural, one {eine Navigation} other {# Navigationen}} blockiert: {addressClass}.{unresolved, plural, =0 {} other { Name nicht auflösbar: Die lokale Namensauflösung lieferte keine Adresse{hasLookupCodes, select, true {, Resolver-Fehler: {lookupCodes}} other {}}.}}{nonPublic, plural, =0 {} other { Private Adresse: Das Ziel liegt in einem nicht-öffentlichen Adressbereich.}} Betroffene Dokumente wurden nicht abgerufen.{recovered, plural, =0 {} one { Eine weitere Navigation wurde zunächst blockiert und nach Wiederholung geladen.} other { # weitere Navigationen wurden zunächst blockiert und nach Wiederholung geladen.}}"
