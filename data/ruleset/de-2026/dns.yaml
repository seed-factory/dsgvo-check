# Ruleset de-2026, module dns. Severity per (checkId, variant); variant names and levels follow the
# registry docs/03-checks.md §2.1. T3 codes stay at warning or below. MAIL-02 follows the
# DMARC matrix of BSI TR-03182.
checks:
  MAIL-01:
    gating: true
    variants:
      record-not-found: { severity: warning }
      policy-none: { severity: warning }
      record-invalid: { severity: warning }
      weak-option: { severity: info }
      legacy-pct: { severity: info }
  MAIL-02:
    gating: true
    variants:
      record-not-found: { severity: warning }
      permissive-qualifier: { severity: warning }
      record-invalid: { severity: warning }
      softfail-without-enforcement: { severity: warning }
      softfail-with-enforcement: { severity: info }
      ptr-mechanism: { severity: info }
