# Canary corpus of the dsgvo-check prototype: exactly 100 public websites of organizations (no private persons).
# Purpose: a one-off measurement of the scanner (inconclusive share, bot/geo mode, collection errors, CMP
# recognition). It is NOT a list of suspects. Read canary/README.md before running anything.
#
# Fields (validated by scripts/canary-sites.ts, test/unit/canary/*.test.ts):
#   id               <iso-country>-<name>, kebab-case
#   url              start page (no query, no fragment)
#   region           de | eu (EU/EEA without DE) | non-eu (CH counts as non-eu)
#   country          ISO 3166-1 alpha-2 of the operating organization
#   sector, sizeClass
#   expectedCmp      borlabs | cookiebot | complianz | usercentrics | ccm19 | real-cookie-banner | cookiehub
#                    | other | none | unknown
#   cmpSignal        how expectedCmp was established (required unless unknown)
#   selectionReason  neutral and factual
#   publicReference  only for publicly documented cases (authority decision, court, noyb, major media)
#
# expectedCmp was established on 2026-10-30 with ONE GET of the start page per site from a German connection
# (Chrome UA + dsgvo-check token), by markers in the static HTML (loader scripts, element ids, config objects).
# "none" means: no CMP loader, no banner element and no cookie notice in the static HTML; a banner injected later
# by JavaScript cannot be ruled out. "unknown": blocked, ambiguous or nothing conclusive in the static HTML.
# "other": a CMP outside the seven adapters (OneTrust, Sourcepoint, Didomi, consentmanager, own banners, …).
